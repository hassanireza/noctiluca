<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="768" viewBox="0 0 1200 768" role="img" aria-labelledby="t d"><title id="t">Noctiluca architecture</title><desc id="d">Browser-only architecture: main.tsx mounts App.tsx, which reads questions.ts, stores progress in localStorage, embeds CodeMirror and talks to a Web Worker that runs Pyodide fetched from jsDelivr. Hosted on GitHub Pages.</desc><defs><style>.s{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-style:italic}.m{font-family:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}.b{font-family:'DM Sans','Segoe UI',Helvetica,Arial,sans-serif}</style><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#a8c8bb" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><radialGradient id="glow" cx="50%" cy="-10%" r="75%"><stop offset="0" stop-color="#1b2524"/><stop offset="0.55" stop-color="#090b0d" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1200" height="768" rx="6" fill="#090b0d" /><rect x="0" y="0" width="1200" height="768" rx="6" fill="url(#glow)" /><rect x="0.5" y="0.5" width="1199" height="767" rx="6" fill="none" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><text x="40" y="46" class="m" font-size="10" fill="#92ab9f" letter-spacing="1.7000000000000002" xml:space="preserve" >ARCHITECTURE</text><text x="40" y="84" class="s" font-size="30" fill="#e8e5df" xml:space="preserve" >A static page, a worker and a runtime.</text><line x1="40" y1="104" x2="1160" y2="104" stroke="#dbe1e1" stroke-opacity="0.1" stroke-width="1"/><rect x="30" y="126" width="1140" height="472" rx="4" fill="none" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.16" stroke-dasharray="4 6"/><text x="50" y="152" class="m" font-size="9.5" fill="#92ab9f" letter-spacing="1.6150000000000002" xml:space="preserve" >BROWSER · EVERYTHING RUNS CLIENT-SIDE</text><rect x="60" y="172" width="280" height="98" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><text x="76" y="196" class="m" font-size="9" fill="#92ab9f" letter-spacing="1.53" xml:space="preserve" >ENTRY</text><g transform="translate(306 184) scale(0.7500)" fill="none" stroke="#a8c8bb" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5M3 16.5l9 5 9-5"/></g><text x="76" y="220" class="m" font-size="12.5" fill="#d3ded4" xml:space="preserve" >src/main.tsx</text><text x="76" y="240" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >React 18 StrictMode root and global</text><text x="76" y="255" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >stylesheet.</text><rect x="60" y="290" width="280" height="178" rx="2" fill="#101316" stroke="#c7b68e" stroke-width="1" stroke-opacity="0.28" /><text x="76" y="314" class="m" font-size="9" fill="#c7b68e" letter-spacing="1.53" xml:space="preserve" >DATA</text><g transform="translate(306 302) scale(0.7500)" fill="none" stroke="#c7b68e" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h7a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H3z"/><path d="M21 5h-7a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h7z"/></g><text x="76" y="338" class="m" font-size="12.5" fill="#d3ded4" xml:space="preserve" >src/questions.ts</text><text x="76" y="358" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >1,000 Question records: 20 authored</text><text x="76" y="373" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >and 980 produced by makeQuestion()</text><text x="76" y="388" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >across ten tiers. A build-time guard</text><text x="76" y="403" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >rejects any solution over 20 lines.</text><rect x="60" y="488" width="280" height="86" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><text x="76" y="512" class="m" font-size="9" fill="#92ab9f" letter-spacing="1.53" xml:space="preserve" >PERSISTENCE</text><g transform="translate(306 500) scale(0.7500)" fill="none" stroke="#a8c8bb" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></g><text x="76" y="536" class="m" font-size="12.5" fill="#d3ded4" xml:space="preserve" >localStorage</text><text x="76" y="556" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >noctiluca.save.v1</text><rect x="430" y="172" width="340" height="402" rx="2" fill="#101316" stroke="#a8c8bb" stroke-width="1" stroke-opacity="0.28" /><text x="448" y="198" class="m" font-size="9" fill="#a8c8bb" letter-spacing="1.53" xml:space="preserve" >UI · SINGLE COMPONENT</text><g transform="translate(734 184) scale(0.7500)" fill="none" stroke="#a8c8bb" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><path d="M13 16.5h7M16.5 13v7"/></g><text x="448" y="224" class="m" font-size="14" fill="#d3ded4" xml:space="preserve" >src/App.tsx</text><rect x="448" y="246" width="304" height="68" rx="2" fill="#0e1114" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.12" /><text x="462" y="274" class="m" font-size="11" fill="#a8c8bb" xml:space="preserve" >Progress state</text><text x="462" y="296" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >done[], streak, lastDay, xp</text><rect x="448" y="326" width="304" height="68" rx="2" fill="#0e1114" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.12" /><text x="462" y="354" class="m" font-size="11" fill="#a8c8bb" xml:space="preserve" >Map view</text><text x="462" y="376" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >50 episode blocks, 20 level tiles each</text><rect x="448" y="406" width="304" height="68" rx="2" fill="#0e1114" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.12" /><text x="462" y="434" class="m" font-size="11" fill="#a8c8bb" xml:space="preserve" >Challenge view</text><text x="462" y="456" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >prompt, editor, hint, output, next level</text><rect x="448" y="486" width="304" height="68" rx="2" fill="#0e1114" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.12" /><text x="462" y="514" class="m" font-size="11" fill="#a8c8bb" xml:space="preserve" >Install toast</text><text x="462" y="536" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >listens for beforeinstallprompt</text><rect x="860" y="172" width="280" height="98" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><text x="876" y="196" class="m" font-size="9" fill="#92ab9f" letter-spacing="1.53" xml:space="preserve" >EDITOR</text><g transform="translate(1106 184) scale(0.7500)" fill="none" stroke="#a8c8bb" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/></g><text x="876" y="220" class="m" font-size="12.5" fill="#d3ded4" xml:space="preserve" >CodeMirror 6</text><text x="876" y="240" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >@uiw/react-codemirror, lang-python,</text><text x="876" y="255" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >one-dark theme.</text><rect x="860" y="290" width="280" height="178" rx="2" fill="#101316" stroke="#a7b9cd" stroke-width="1" stroke-opacity="0.28" /><text x="876" y="314" class="m" font-size="9" fill="#a7b9cd" letter-spacing="1.53" xml:space="preserve" >WORKER</text><g transform="translate(1106 302) scale(0.7500)" fill="none" stroke="#a7b9cd" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></g><text x="876" y="338" class="m" font-size="12.5" fill="#d3ded4" xml:space="preserve" >python.worker.ts</text><text x="876" y="358" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >Module Web Worker. Loads the runtime</text><text x="876" y="373" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >once, runs your code, then the</text><text x="876" y="388" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >authored target, and replies with</text><text x="876" y="403" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >output and a solved flag.</text><rect x="860" y="488" width="280" height="86" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><text x="876" y="512" class="m" font-size="9" fill="#92ab9f" letter-spacing="1.53" xml:space="preserve" >RUNTIME</text><g transform="translate(1106 500) scale(0.7500)" fill="none" stroke="#a8c8bb" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M7 9.5l3 2.5-3 2.5M12.5 15h4.5"/></g><text x="876" y="536" class="m" font-size="12.5" fill="#d3ded4" xml:space="preserve" >Pyodide 0.29.5</text><text x="876" y="556" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >CPython compiled to WebAssembly.</text><path d="M340 221 L430 221" fill="none" stroke="#a8c8bb" stroke-opacity="1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar)"/><text x="385" y="213" class="m" font-size="8" fill="#75847b" text-anchor="middle" xml:space="preserve" >mounts</text><path d="M340 380 L430 380" fill="none" stroke="#a8c8bb" stroke-opacity="1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar)"/><text x="385" y="372" class="m" font-size="8" fill="#75847b" text-anchor="middle" xml:space="preserve" >imports</text><path d="M340 531 L430 531" fill="none" stroke="#a8c8bb" stroke-opacity="1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar)" marker-start="url(#ar)"/><text x="385" y="523" class="m" font-size="8" fill="#75847b" text-anchor="middle" xml:space="preserve" >save/load</text><path d="M770 221 L860 221" fill="none" stroke="#a8c8bb" stroke-opacity="1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar)" marker-start="url(#ar)"/><text x="815" y="213" class="m" font-size="8" fill="#75847b" text-anchor="middle" xml:space="preserve" >value</text><path d="M770 380 L860 380" fill="none" stroke="#a8c8bb" stroke-opacity="1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar)" marker-start="url(#ar)"/><text x="815" y="372" class="m" font-size="8" fill="#75847b" text-anchor="middle" xml:space="preserve" >postMessage</text><path d="M1000 468 L1000 488" fill="none" stroke="#a8c8bb" stroke-opacity="1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar)"/><rect x="60" y="636" width="280" height="94" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><text x="76" y="660" class="m" font-size="9" fill="#92ab9f" letter-spacing="1.53" xml:space="preserve" >HOST</text><g transform="translate(306 648) scale(0.7500)" fill="none" stroke="#a8c8bb" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5a4.5 4.5 0 0 1-.5-8.97 6 6 0 0 1 11.3 1.47A4 4 0 0 1 17.5 18.5z"/></g><text x="76" y="684" class="m" font-size="12.5" fill="#d3ded4" xml:space="preserve" >GitHub Pages</text><text x="76" y="704" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >Serves the static dist/ bundle under</text><text x="76" y="719" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >/noctiluca/.</text><rect x="430" y="636" width="340" height="94" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><text x="446" y="660" class="m" font-size="9" fill="#92ab9f" letter-spacing="1.53" xml:space="preserve" >BUILD</text><g transform="translate(736 648) scale(0.7500)" fill="none" stroke="#a8c8bb" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></g><text x="446" y="684" class="m" font-size="12.5" fill="#d3ded4" xml:space="preserve" >Vite 7 + tsc -b</text><text x="446" y="704" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >Type-checks, then bundles app and worker as ES</text><text x="446" y="719" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >modules.</text><rect x="860" y="636" width="280" height="94" rx="2" fill="#101316" stroke="#c6a7a7" stroke-width="1" stroke-opacity="0.28" /><text x="876" y="660" class="m" font-size="9" fill="#c6a7a7" letter-spacing="1.53" xml:space="preserve" >CDN</text><g transform="translate(1106 648) scale(0.7500)" fill="none" stroke="#c6a7a7" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.8 3 2.8 15 0 18M12 3c-2.8 3-2.8 15 0 18"/></g><text x="876" y="684" class="m" font-size="12.5" fill="#d3ded4" xml:space="preserve" >cdn.jsdelivr.net</text><text x="876" y="704" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >Pyodide 0.29.5 files, fetched at first</text><text x="876" y="719" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >run.</text><path d="M430 679 L340 679" fill="none" stroke="#a8c8bb" stroke-opacity="1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar)"/><text x="385" y="671" class="m" font-size="8" fill="#75847b" text-anchor="middle" xml:space="preserve" >emits dist/</text><path d="M200 636 L200 598" fill="none" stroke="#a8c8bb" stroke-opacity="1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar)"/><text x="210" y="622" class="m" font-size="8" fill="#75847b" xml:space="preserve" >serves</text><path d="M1000 636 L1000 578" fill="none" stroke="#a8c8bb" stroke-opacity="1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar)" stroke-dasharray="3 5"/><text x="1010" y="622" class="m" font-size="8" fill="#75847b" xml:space="preserve" >first run only</text></svg>
