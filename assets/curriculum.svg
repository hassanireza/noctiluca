<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d"><title id="t">Noctiluca curriculum</title><desc id="d">Ten difficulty tiers of one hundred levels each, with essence per level rising from 12 to 30 and a new concept introduced from tier three to ten.</desc><defs><style>.s{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-style:italic}.m{font-family:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}.b{font-family:'DM Sans','Segoe UI',Helvetica,Arial,sans-serif}</style><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#a8c8bb" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><radialGradient id="glow" cx="50%" cy="-10%" r="75%"><stop offset="0" stop-color="#1b2524"/><stop offset="0.55" stop-color="#090b0d" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1200" height="660" rx="6" fill="#090b0d" /><rect x="0" y="0" width="1200" height="660" rx="6" fill="url(#glow)" /><rect x="0.5" y="0.5" width="1199" height="659" rx="6" fill="none" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><text x="40" y="46" class="m" font-size="10" fill="#92ab9f" letter-spacing="1.7000000000000002" xml:space="preserve" >CURRICULUM</text><text x="40" y="84" class="s" font-size="30" fill="#e8e5df" xml:space="preserve" >Ten tiers, one new idea at a time.</text><line x1="40" y1="104" x2="1160" y2="104" stroke="#dbe1e1" stroke-opacity="0.1" stroke-width="1"/><text x="40" y="132" class="m" font-size="8.5" fill="#75847b" letter-spacing="1.445" xml:space="preserve" >TIER</text><text x="130" y="132" class="m" font-size="8.5" fill="#75847b" letter-spacing="1.445" xml:space="preserve" >LEVELS</text><text x="250" y="132" class="m" font-size="8.5" fill="#75847b" letter-spacing="1.445" xml:space="preserve" >ESSENCE PER LEVEL</text><text x="480" y="132" class="m" font-size="8.5" fill="#75847b" letter-spacing="1.445" xml:space="preserve" >WHAT THE TIER ADDS</text><rect x="30" y="144" width="1140" height="44" rx="0" fill="#0c0f11" /><circle cx="48" cy="166" r="4" fill="#a8c8bb" /><text x="62" y="170" class="m" font-size="12" fill="#a8c8bb" letter-spacing="1" xml:space="preserve" >T01</text><text x="130" y="170" class="m" font-size="11.5" fill="#c9cdc9" xml:space="preserve" >001–100</text><rect x="250" y="159" width="64.0" height="14" rx="1" fill="#a8c8bb" stroke="#a8c8bb" stroke-width="1" stroke-opacity="0.6" fill-opacity="0.2" /><text x="324.0" y="170" class="m" font-size="11" fill="#a8c8bb" xml:space="preserve" >12</text><text x="480" y="164" class="m" font-size="11.5" fill="#d3ded4" xml:space="preserve" >Ten base templates</text><text x="480" y="179" class="b" font-size="10.5" fill="#777c7e" xml:space="preserve" >output, arithmetic, slicing, length, loops, conditions, functions, sums, counting, stars</text><circle cx="48" cy="212" r="4" fill="#a7b9cd" /><text x="62" y="216" class="m" font-size="12" fill="#a7b9cd" letter-spacing="1" xml:space="preserve" >T02</text><text x="130" y="216" class="m" font-size="11.5" fill="#c9cdc9" xml:space="preserve" >101–200</text><rect x="250" y="205" width="74.66666666666667" height="14" rx="1" fill="#a7b9cd" stroke="#a7b9cd" stroke-width="1" stroke-opacity="0.6" fill-opacity="0.2" /><text x="334.6666666666667" y="216" class="m" font-size="11" fill="#a7b9cd" xml:space="preserve" >14</text><text x="480" y="210" class="m" font-size="11.5" fill="#d3ded4" xml:space="preserve" >Scaled up</text><text x="480" y="225" class="b" font-size="10.5" fill="#777c7e" xml:space="preserve" >same templates with larger values and new words</text><rect x="30" y="236" width="1140" height="44" rx="0" fill="#0c0f11" /><circle cx="48" cy="258" r="4" fill="#b6a8c8" /><text x="62" y="262" class="m" font-size="12" fill="#b6a8c8" letter-spacing="1" xml:space="preserve" >T03</text><text x="130" y="262" class="m" font-size="11.5" fill="#c9cdc9" xml:space="preserve" >201–300</text><rect x="250" y="251" width="85.33333333333333" height="14" rx="1" fill="#b6a8c8" stroke="#b6a8c8" stroke-width="1" stroke-opacity="0.6" fill-opacity="0.2" /><text x="345.3333333333333" y="262" class="m" font-size="11" fill="#b6a8c8" xml:space="preserve" >16</text><text x="480" y="256" class="m" font-size="11.5" fill="#d3ded4" xml:space="preserve" >+ Powers</text><text x="480" y="271" class="b" font-size="10.5" fill="#777c7e" xml:space="preserve" >squares of three consecutive numbers</text><circle cx="48" cy="304" r="4" fill="#c6a7a7" /><text x="62" y="308" class="m" font-size="12" fill="#c6a7a7" letter-spacing="1" xml:space="preserve" >T04</text><text x="130" y="308" class="m" font-size="11.5" fill="#c9cdc9" xml:space="preserve" >301–400</text><rect x="250" y="297" width="96.0" height="14" rx="1" fill="#c6a7a7" stroke="#c6a7a7" stroke-width="1" stroke-opacity="0.6" fill-opacity="0.2" /><text x="356.0" y="308" class="m" font-size="11" fill="#c6a7a7" xml:space="preserve" >18</text><text x="480" y="302" class="m" font-size="11.5" fill="#d3ded4" xml:space="preserve" >+ Boolean functions</text><text x="480" y="317" class="b" font-size="10.5" fill="#777c7e" xml:space="preserve" >is_even and a remainder check</text><rect x="30" y="328" width="1140" height="44" rx="0" fill="#0c0f11" /><circle cx="48" cy="350" r="4" fill="#c7b68e" /><text x="62" y="354" class="m" font-size="12" fill="#c7b68e" letter-spacing="1" xml:space="preserve" >T05</text><text x="130" y="354" class="m" font-size="11.5" fill="#c9cdc9" xml:space="preserve" >401–500</text><rect x="250" y="343" width="106.66666666666666" height="14" rx="1" fill="#c7b68e" stroke="#c7b68e" stroke-width="1" stroke-opacity="0.6" fill-opacity="0.2" /><text x="366.66666666666663" y="354" class="m" font-size="11" fill="#c7b68e" xml:space="preserve" >20</text><text x="480" y="348" class="m" font-size="11.5" fill="#d3ded4" xml:space="preserve" >+ List analysis</text><text x="480" y="363" class="b" font-size="10.5" fill="#777c7e" xml:space="preserve" >max() over a short list</text><circle cx="48" cy="396" r="4" fill="#91b6b4" /><text x="62" y="400" class="m" font-size="12" fill="#91b6b4" letter-spacing="1" xml:space="preserve" >T06</text><text x="130" y="400" class="m" font-size="11.5" fill="#c9cdc9" xml:space="preserve" >501–600</text><rect x="250" y="389" width="117.33333333333333" height="14" rx="1" fill="#91b6b4" stroke="#91b6b4" stroke-width="1" stroke-opacity="0.6" fill-opacity="0.2" /><text x="377.3333333333333" y="400" class="m" font-size="11" fill="#91b6b4" xml:space="preserve" >22</text><text x="480" y="394" class="m" font-size="11.5" fill="#d3ded4" xml:space="preserve" >+ Comprehensions</text><text x="480" y="409" class="b" font-size="10.5" fill="#777c7e" xml:space="preserve" >cubes in one expression</text><rect x="30" y="420" width="1140" height="44" rx="0" fill="#0c0f11" /><circle cx="48" cy="442" r="4" fill="#c49cae" /><text x="62" y="446" class="m" font-size="12" fill="#c49cae" letter-spacing="1" xml:space="preserve" >T07</text><text x="130" y="446" class="m" font-size="11.5" fill="#c9cdc9" xml:space="preserve" >601–700</text><rect x="250" y="435" width="128.0" height="14" rx="1" fill="#c49cae" stroke="#c49cae" stroke-width="1" stroke-opacity="0.6" fill-opacity="0.2" /><text x="388.0" y="446" class="m" font-size="11" fill="#c49cae" xml:space="preserve" >24</text><text x="480" y="440" class="m" font-size="11.5" fill="#d3ded4" xml:space="preserve" >+ Sets and sorting</text><text x="480" y="455" class="b" font-size="10.5" fill="#777c7e" xml:space="preserve" >sorted(set(...)) for unique values</text><circle cx="48" cy="488" r="4" fill="#99a9c8" /><text x="62" y="492" class="m" font-size="12" fill="#99a9c8" letter-spacing="1" xml:space="preserve" >T08</text><text x="130" y="492" class="m" font-size="11.5" fill="#c9cdc9" xml:space="preserve" >701–800</text><rect x="250" y="481" width="138.66666666666669" height="14" rx="1" fill="#99a9c8" stroke="#99a9c8" stroke-width="1" stroke-opacity="0.6" fill-opacity="0.2" /><text x="398.6666666666667" y="492" class="m" font-size="11" fill="#99a9c8" xml:space="preserve" >26</text><text x="480" y="486" class="m" font-size="11.5" fill="#d3ded4" xml:space="preserve" >+ Recursion</text><text x="480" y="501" class="b" font-size="10.5" fill="#777c7e" xml:space="preserve" >a recursive factorial with a base case</text><rect x="30" y="512" width="1140" height="44" rx="0" fill="#0c0f11" /><circle cx="48" cy="534" r="4" fill="#b4a9a0" /><text x="62" y="538" class="m" font-size="12" fill="#b4a9a0" letter-spacing="1" xml:space="preserve" >T09</text><text x="130" y="538" class="m" font-size="11.5" fill="#c9cdc9" xml:space="preserve" >801–900</text><rect x="250" y="527" width="149.33333333333334" height="14" rx="1" fill="#b4a9a0" stroke="#b4a9a0" stroke-width="1" stroke-opacity="0.6" fill-opacity="0.2" /><text x="409.33333333333337" y="538" class="m" font-size="11" fill="#b4a9a0" xml:space="preserve" >28</text><text x="480" y="532" class="m" font-size="11.5" fill="#d3ded4" xml:space="preserve" >+ Frequency maps</text><text x="480" y="547" class="b" font-size="10.5" fill="#777c7e" xml:space="preserve" >counting characters with dict.get</text><circle cx="48" cy="580" r="4" fill="#a8bd91" /><text x="62" y="584" class="m" font-size="12" fill="#a8bd91" letter-spacing="1" xml:space="preserve" >T10</text><text x="130" y="584" class="m" font-size="11.5" fill="#c9cdc9" xml:space="preserve" >901–1000</text><rect x="250" y="573" width="160.0" height="14" rx="1" fill="#a8bd91" stroke="#a8bd91" stroke-width="1" stroke-opacity="0.6" fill-opacity="0.2" /><text x="420.0" y="584" class="m" font-size="11" fill="#a8bd91" xml:space="preserve" >30</text><text x="480" y="578" class="m" font-size="11.5" fill="#d3ded4" xml:space="preserve" >+ Nested patterns</text><text x="480" y="593" class="b" font-size="10.5" fill="#777c7e" xml:space="preserve" >number triangles with a nested join</text><text x="600.0" y="638" class="m" font-size="9.5" fill="#75847b" text-anchor="middle" letter-spacing="0.6" xml:space="preserve" >Tiers follow level ids: tier = ceil(id / 100). Each new concept appears on one level in ten. Every solution stays at 20 lines or fewer.</text></svg>
