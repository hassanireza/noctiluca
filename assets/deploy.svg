1a2" letter-spacing="1" xml:space="preserve" >02</text><text x="217" y="182" class="m" font-size="11.5" fill="#e6f1f7" letter-spacing="1" font-weight="500" xml:space="preserve" >CHECKOUT</text><text x="217" y="206" class="b" font-size="10.5" fill="#9db2c1" xml:space="preserve" >actions/checkout@v4</text><path d="M341 193 L366 193" fill="none" stroke="#6fe3f2" stroke-opacity="1" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="366" y="134" width="138" height="118" rx="16" fill="#0a1622" stroke="#8fdcf0" stroke-width="1" stroke-opacity="0.16" /><text x="380" y="160" class="m" font-size="9" fill="#7a91a2" letter-spacing="1" xml:space="preserve" >03</text><text x="380" y="182" class="m" font-size="11.5" fill="#e6f1f7" letter-spacing="1" font-weight="500" xml:space="preserve" >NODE 22</text><text x="380" y="206" class="b" font-size="10.5" fill="#9db2c1" xml:space="preserve" >setup-node@v4 with</text><text x="380" y="221" class="b" font-size="10.5" fill="#9db2c1" xml:space="preserve" >the npm cache</text><path d="M504 193 L529 193" fill="none" stroke="#6fe3f2" stroke-opacity="1" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="529" y="134" width="138" height="118" rx="16" fill="#0a1622" stroke="#8fdcf0" stroke-width="1" stroke-opacity="0.16" /><text x="543" y="160" class="m" font-size="9" fill="#7a91a2" letter-spacing="1" xml:space="preserve" >04</text><text x="543" y="182" class="m" font-size="11.5" fill="#e6f1f7" letter-spacing="1" font-weight="500" xml:space="preserve" >INSTALL</text><text x="543" y="206" class="b" font-size="10.5" fill="#9db2c1" xml:space="preserve" >npm ci</text><path d="M667 193 L692 193" fill="none" stroke="#6fe3f2" stroke-opacity="1" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="692" y="134" width="138" height="118" rx="16" fill="#0a1622" stroke="#8fdcf0" stroke-width="1" stroke-opacity="0.16" /><text x="706" y="160" class="m" font-size="9" fill="#7a91a2" letter-spacing="1" xml:space="preserve" >05</text><text x="706" y="182" class="m" font-size="11.5" fill="#e6f1f7" letter-spacing="1" font-weight="500" xml:space="preserve" >BUILD</text><text x="706" y="206" class="b" font-size="10.5" fill="#9db2c1" xml:space="preserve" >tsc -b &amp;&amp; vite</text><text x="706" y="221" class="b" font-size="10.5" fill="#9db2c1" xml:space="preserve" >build into dist/</text><path d="M830 193 L855 193" fill="none" stroke="#6fe3f2" stroke-opacity="1" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="855" y="134" width="138" height="118" rx="16" fill="#0a1622" stroke="#8fdcf0" stroke-width="1" stroke-opacity="0.16" /><text x="869" y="160" class="m" font-size="9" fill="#7a91a2" letter-spacing="1" xml:space="preserve" >06</text><text x="869" y="182" class="m" font-size="11.5" fill="#e6f1f7" letter-spacing="1" font-weight="500" xml:space="preserve" >UPLOAD</text><text x="869" y="206" class="b" font-size="10.5" fill="#9db2c1" xml:space="preserve" >upload-pages-</text><text x="869" y="221" class="b" font-size="10.5" fill="#9db2c1" xml:space="preserve" >artifact@v3</text><path d="M993 193 L1018 193" fill="none" stroke="#6fe3f2" stroke-opacity="1" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="1018" y="134" width="138" height="118" rx="16" fill="#0a1622" stroke="#6fe3f2" stroke-width="1" stroke-opacity="0.3" /><rect x="1018" y="134" width="138" height="118" rx="16" fill="#6fe3f2" fill-opacity="0.06" /><text x="1032" y="160" class="m" font-size="9" fill="#7a91a2" letter-spacing="1" xml:space="preserve" >07</text><text x="1032" y="182" class="m" font-size="11.5" fill="#6fe3f2" letter-spacing="1" font-weight="500" xml:space="preserve" >DEPLOY</text><text x="1032" y="206" class="b" font-size="10.5" fill="#9db2c1" xml:space="preserve" >deploy-pages@v4 to</text><text x="1032" y="221" class="b" font-size="10.5" fill="#9db2c1" xml:space="preserve" >github-pages</text><rect x="40" y="276" width="118.39999999999999" height="28" rx="14" fill="#0c2230" stroke="#8fdcf0" stroke-width="1" stroke-opacity="0.2" /><text x="53" y="294" class="m" font-size="10" fill="#9db2c1" xml:space="preserve" >contents: read</text><rect x="168.39999999999998" y="276" width="105.19999999999999" height="28" rx="14" fill="#0c2230" stroke="#8fdcf0" stroke-width="1" stroke-opacity="0.2" /><text x="181.39999999999998" y="294" class="m" font-size="10" fill="#9db2c1" xml:space="preserve" >pages: write</text><rect x="283.59999999999997" y="276" width="125.0" height="28" rx="14" fill="#0c2230" stroke="#8fdcf0" stroke-width="1" stroke-opacity="0.2" /><text x="296.59999999999997" y="294" class="m" font-size="10" fill="#9db2c1" xml:space="preserve" >id-token: write</text><rect x="418.59999999999997" y="276" width="276.79999999999995" height="28" rx="14" fill="#0c2230" stroke="#8fdcf0" stroke-width="1" stroke-opacity="0.2" /><text x="431.59999999999997" y="294" class="m" font-size="10" fill="#9db2c1" xml:space="preserve" >concurrency: pages, cancel in progress</text><text x="1160" y="294" class="m" font-size="10.5" fill="#6fe3f2" text-anchor="end" xml:space="preserve" >hassanireza.github.io/noctiluca</text><text x="600.0" y="330" class="m" font-size="9.5" fill="#7a91a2" text-anchor="middle" letter-spacing="0.6" xml:space="preserve" >Vite base is /noctiluca/. In repository settings, set the Pages source to GitHub Actions.</text></svg>
