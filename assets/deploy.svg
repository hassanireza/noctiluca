<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d"><title id="t">Noctiluca deployment pipeline</title><desc id="d">GitHub Actions workflow: push, checkout, Node 22, npm ci, build, upload the Pages artifact, deploy to GitHub Pages.</desc><defs><style>.s{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-style:italic}.m{font-family:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}.b{font-family:'DM Sans','Segoe UI',Helvetica,Arial,sans-serif}</style><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#a8c8bb" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><radialGradient id="glow" cx="50%" cy="-10%" r="75%"><stop offset="0" stop-color="#1b2524"/><stop offset="0.55" stop-color="#090b0d" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1200" height="340" rx="6" fill="#090b0d" /><rect x="0" y="0" width="1200" height="340" rx="6" fill="url(#glow)" /><rect x="0.5" y="0.5" width="1199" height="339" rx="6" fill="none" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><text x="40" y="46" class="m" font-size="10" fill="#92ab9f" letter-spacing="1.7000000000000002" xml:space="preserve" >DEPLOYMENT</text><text x="40" y="84" class="s" font-size="30" fill="#e8e5df" xml:space="preserve" >Push to main, publish to Pages.</text><line x1="40" y1="104" x2="1160" y2="104" stroke="#dbe1e1" stroke-opacity="0.1" stroke-width="1"/><rect x="40" y="132" width="138" height="112" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><text x="54" y="158" class="m" font-size="9" fill="#75847b" letter-spacing="1" xml:space="preserve" >01</text><text x="54" y="180" class="m" font-size="11.5" fill="#d3ded4" letter-spacing="1" xml:space="preserve" >PUSH</text><text x="54" y="204" class="b" font-size="10.5" fill="#9b9f9d" xml:space="preserve" >main branch, or run</text><text x="54" y="219" class="b" font-size="10.5" fill="#9b9f9d" xml:space="preserve" >it by hand</text><path d="M178 188 L203 188" fill="none" stroke="#a8c8bb" stroke-opacity="1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar)"/><rect x="203" y="132" width="138" height="112" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><text x="217" y="158" class="m" font-size="9" fill="#75847b" letter-spacing="1" xml:space="preserve" >02</text><text x="217" y="180" class="m" font-size="11.5" fill="#d3ded4" letter-spacing="1" xml:space="preserve" >CHECKOUT</text><text x="217" y="204" class="b" font-size="10.5" fill="#9b9f9d" xml:space="preserve" >actions/checkout@v4</text><path d="M341 188 L366 188" fill="none" stroke="#a8c8bb" stroke-opacity="1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar)"/><rect x="366" y="132" width="138" height="112" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><text x="380" y="158" class="m" font-size="9" fill="#75847b" letter-spacing="1" xml:space="preserve" >03</text><text x="380" y="180" class="m" font-size="11.5" fill="#d3ded4" letter-spacing="1" xml:space="preserve" >NODE 22</text><text x="380" y="204" class="b" font-size="10.5" fill="#9b9f9d" xml:space="preserve" >setup-node@v4 with</text><text x="380" y="219" class="b" font-size="10.5" fill="#9b9f9d" xml:space="preserve" >the npm cache</text><path d="M504 188 L529 188" fill="none" stroke="#a8c8bb" stroke-opacity="1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar)"/><rect x="529" y="132" width="138" height="112" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><text x="543" y="158" class="m" font-size="9" fill="#75847b" letter-spacing="1" xml:space="preserve" >04</text><text x="543" y="180" class="m" font-size="11.5" fill="#d3ded4" letter-spacing="1" xml:space="preserve" >INSTALL</text><text x="543" y="204" class="b" font-size="10.5" fill="#9b9f9d" xml:space="preserve" >npm ci</text><path d="M667 188 L692 188" fill="none" stroke="#a8c8bb" stroke-opacity="1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar)"/><rect x="692" y="132" width="138" height="112" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><text x="706" y="158" class="m" font-size="9" fill="#75847b" letter-spacing="1" xml:space="preserve" >05</text><text x="706" y="180" class="m" font-size="11.5" fill="#d3ded4" letter-spacing="1" xml:space="preserve" >BUILD</text><text x="706" y="204" class="b" font-size="10.5" fill="#9b9f9d" xml:space="preserve" >tsc -b &amp;&amp; vite</text><text x="706" y="219" class="b" font-size="10.5" fill="#9b9f9d" xml:space="preserve" >build into dist/</text><path d="M830 188 L855 188" fill="none" stroke="#a8c8bb" stroke-opacity="1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar)"/><rect x="855" y="132" width="138" height="112" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><text x="869" y="158" class="m" font-size="9" fill="#75847b" letter-spacing="1" xml:space="preserve" >06</text><text x="869" y="180" class="m" font-size="11.5" fill="#d3ded4" letter-spacing="1" xml:space="preserve" >UPLOAD</text><text x="869" y="204" class="b" font-size="10.5" fill="#9b9f9d" xml:space="preserve" >upload-pages-</text><text x="869" y="219" class="b" font-size="10.5" fill="#9b9f9d" xml:space="preserve" >artifact@v3</text><path d="M993 188 L1018 188" fill="none" stroke="#a8c8bb" stroke-opacity="1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar)"/><rect x="1018" y="132" width="138" height="112" rx="2" fill="#101316" stroke="#a8c8bb" stroke-width="1" stroke-opacity="0.28" /><text x="1032" y="158" class="m" font-size="9" fill="#75847b" letter-spacing="1" xml:space="preserve" >07</text><text x="1032" y="180" class="m" font-size="11.5" fill="#a8c8bb" letter-spacing="1" xml:space="preserve" >DEPLOY</text><text x="1032" y="204" class="b" font-size="10.5" fill="#9b9f9d" xml:space="preserve" >deploy-pages@v4 to</text><text x="1032" y="219" class="b" font-size="10.5" fill="#9b9f9d" xml:space="preserve" >github-pages</text><rect x="40" y="268" width="116.39999999999999" height="26" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.16" /><text x="52" y="285" class="m" font-size="10" fill="#9b9f9d" xml:space="preserve" >contents: read</text><rect x="166.39999999999998" y="268" width="103.19999999999999" height="26" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.16" /><text x="178.39999999999998" y="285" class="m" font-size="10" fill="#9b9f9d" xml:space="preserve" >pages: write</text><rect x="279.59999999999997" y="268" width="123.0" height="26" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.16" /><text x="291.59999999999997" y="285" class="m" font-size="10" fill="#9b9f9d" xml:space="preserve" >id-token: write</text><rect x="412.59999999999997" y="268" width="274.79999999999995" height="26" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.16" /><text x="424.59999999999997" y="285" class="m" font-size="10" fill="#9b9f9d" xml:space="preserve" >concurrency: pages, cancel in progress</text><text x="1160" y="285" class="m" font-size="10.5" fill="#a8c8bb" text-anchor="end" xml:space="preserve" >hassanireza.github.io/noctiluca</text><text x="600.0" y="320" class="m" font-size="9.5" fill="#75847b" text-anchor="middle" letter-spacing="0.6" xml:space="preserve" >Vite base is /noctiluca/. Pages source must be set to GitHub Actions.</text></svg>
