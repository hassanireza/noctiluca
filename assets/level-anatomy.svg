<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Anatomy of a Noctiluca level</title><desc id="d">The Question type with its fields, how levels are authored or generated by buildLevels over 157 puzzle families, and level 12 as an example of a function level with a test probe.</desc><defs><style>.s{font-family:'Playfair Display',Georgia,'Times New Roman',serif}.si{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-style:italic}.m{font-family:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}.b{font-family:'DM Sans','Segoe UI',Helvetica,Arial,sans-serif}</style><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#6fe3f2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker><radialGradient id="bgtop" cx="50%" cy="-10%" r="85%"><stop offset="0" stop-color="#0b3146"/><stop offset="0.6" stop-color="#0b3146" stop-opacity="0"/></radialGradient><radialGradient id="bgcorner" cx="100%" cy="100%" r="70%"><stop offset="0" stop-color="#0a2236"/><stop offset="1" stop-color="#0a2236" stop-opacity="0"/></radialGradient><radialGradient id="halo"><stop offset="0" stop-color="#3fd6f0" stop-opacity=".55"/><stop offset=".5" stop-color="#1b8fb0" stop-opacity=".16"/><stop offset="1" stop-color="#1b8fb0" stop-opacity="0"/></radialGradient><radialGradient id="cellg" cx="38%" cy="34%" r="75%"><stop offset="0" stop-color="#eafdff"/><stop offset=".38" stop-color="#7defff"/><stop offset="1" stop-color="#1a8fb4"/></radialGradient><linearGradient id="btn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9af4ff"/><stop offset="1" stop-color="#6fe3f2"/></linearGradient><linearGradient id="dock" x1="0" y1="0" x2="1" y2="0.4"><stop offset="0" stop-color="#0f4157"/><stop offset="1" stop-color="#0b2a3c"/></linearGradient><linearGradient id="meter" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2aa6c4"/><stop offset=".6" stop-color="#6fe3f2"/><stop offset="1" stop-color="#b9fbff"/></linearGradient></defs><rect x="0" y="0" width="1200" height="620" rx="14" fill="#04080f" /><rect x="0" y="0" width="1200" height="620" rx="14" fill="url(#bgtop)" /><rect x="0" y="0" width="1200" height="620" rx="14" fill="url(#bgcorner)" /><circle cx="1187.9" cy="138.2" r="0.7" fill="#9cf3ff" fill-opacity="0.19" /><circle cx="911.9" cy="298.4" r="2.2" fill="#9cf3ff" fill-opacity="0.34" /><circle cx="922.3" cy="31.4" r="1" fill="#9cf3ff" fill-opacity="0.29" /><circle cx="231.6" cy="167.1" r="1.7" fill="#9cf3ff" fill-opacity="0.25" /><circle cx="411.7" cy="403.8" r="0.7" fill="#9cf3ff" fill-opacity="0.24" /><circle cx="381.8" cy="159.5" r="1" fill="#9cf3ff" fill-opacity="0.29" /><circle cx="1114.5" cy="422.5" r="1.3" fill="#9cf3ff" fill-opacity="0.22" /><circle cx="1071.0" cy="318.6" r="1.7" fill="#9cf3ff" fill-opacity="0.21" /><circle cx="99.0" cy="432.5" r="1" fill="#9cf3ff" fill-opacity="0.14" /><circle cx="203.8" cy="486.7" r="1" fill="#9cf3ff" fill-opacity="0.15" /><circle cx="1004.1" cy="28.6" r="2.2" fill="#9cf3ff" fill-opacity="0.32" /><circle cx="855.1" cy="29.9" r="0.7" fill="#9cf3ff" fill-opacity="0.32" /><circle cx="536.7" cy="192.4" r="1.7" fill="#9cf3ff" fill-opacity="0.24" /><circle cx="17.2" cy="387.7" r="1.7" fill="#9cf3ff" fill-opacity="0.25" /><circle cx="777.8" cy="503.7" r="0.7" fill="#9cf3ff" fill-opacity="0.16" /><circle cx="1155.1" cy="110.9" r="1.3" fill="#9cf3ff" fill-opacity="0.33" /><circle cx="530.7" cy="93.4" r="2.2" fill="#9cf3ff" fill-opacity="0.13" /><circle cx="492.5" cy="189.8" r="0.7" fill="#9cf3ff" fill-opacity="0.22" /><circle cx="891.2" cy="349.6" r="1" fill="#9cf3ff" fill-opacity="0.22" /><circle cx="1182.6" cy="254.7" r="1.3" fill="#9cf3ff" fill-opacity="0.31" /><circle cx="1165.7" cy="69.5" r="1.7" fill="#9cf3ff" fill-opacity="0.14" /><circle cx="912.8" cy="351.2" r="1.7" fill="#9cf3ff" fill-opacity="0.14" /><circle cx="643.2" cy="203.4" r="2.2" fill="#9cf3ff" fill-opacity="0.2" /><circle cx="1097.4" cy="39.8" r="2.2" fill="#9cf3ff" fill-opacity="0.24" /><circle cx="23.2" cy="354.1" r="0.7" fill="#9cf3ff" fill-opacity="0.19" /><circle cx="924.4" cy="324.4" r="2.2" fill="#9cf3ff" fill-opacity="0.17" /><circle cx="647.7" cy="390.0" r="0.7" fill="#9cf3ff" fill-opacity="0.29" /><circle cx="874.4" cy="169.0" r="0.7" fill="#9cf3ff" fill-opacity="0.34" /><circle cx="991.0" cy="214.1" r="1.7" fill="#9cf3ff" fill-opacity="0.21" /><circle cx="741.8" cy="296.9" r="0.7" fill="#9cf3ff" fill-opacity="0.23" /><circle cx="574.4" cy="594.4" r="0.7" fill="#9cf3ff" fill-opacity="0.3" /><circle cx="1125.0" cy="550.5" r="1.3" fill="#9cf3ff" fill-opacity="0.18" /><circle cx="855.6" cy="53.3" r="1.3" fill="#9cf3ff" fill-opacity="0.22" /><circle cx="787.9" cy="91.9" r="2.2" fill="#9cf3ff" fill-opacity="0.3" /><circle cx="207.8" cy="42.9" r="1.3" fill="#9cf3ff" fill-opacity="0.21" /><circle cx="878.5" cy="258.7" r="0.7" fill="#9cf3ff" fill-opacity="0.35" /><circle cx="226.8" cy="381.0" r="0.7" fill="#9cf3ff" fill-opacity="0.29" /><circle cx="750.8" cy="195.9" r="1.3" fill="#9cf3ff" fill-opacity="0.27" /><circle cx="497.3" cy="84.3" r="1" fill="#9cf3ff" fill-opacity="0.23" /><circle cx="259.0" cy="286.2" r="1.7" fill="#9cf3ff" fill-opacity="0.29" /><circle cx="877.5" cy="507.1" r="0.7" fill="#9cf3ff" fill-opacity="0.17" /><circle cx="417.8" cy="126.8" r="1.7" fill="#9cf3ff" fill-opacity="0.25" /><circle cx="817.0" cy="349.4" r="2.2" fill="#9cf3ff" fill-opacity="0.35" /><circle cx="956.4" cy="487.1" r="1.7" fill="#9cf3ff" fill-opacity="0.26" /><circle cx="617.6" cy="160.8" r="2.2" fill="#9cf3ff" fill-opacity="0.16" /><circle cx="985.0" cy="406.9" r="1.7" fill="#9cf3ff" fill-opacity="0.24" /><circle cx="458.0" cy="464.2" r="1.3" fill="#9cf3ff" fill-opacity="0.29" /><circle cx="531.8" cy="399.9" r="0.7" fill="#9cf3ff" fill-opacity="0.21" /><circle cx="1063.4" cy="445.2" r="2.2" fill="#9cf3ff" fill-opacity="0.32" /><circle cx="44.7" cy="280.0" r="1" fill="#9cf3ff" fill-opacity="0.32" /><circle cx="499.6" cy="17.7" r="2.2" fill="#9cf3ff" fill-opacity="0.27" /><circle cx="725.0" cy="168.1" r="0.7" fill="#9cf3ff" fill-opacity="0.26" /><circle cx="984.5" cy="557.7" r="2.2" fill="#9cf3ff" fill-opacity="0.33" /><rect x="0.5" y="0.5" width="1199" height="619" rx="14" fill="none" stroke="#8fdcf0" stroke-width="1" stroke-opacity="0.18" /><text x="40" y="46" class="m" font-size="10" fill="#6fe3f2" letter-spacing="1.6" font-weight="500" xml:space="preserve" >AUTHORING</text><text x="40" y="86" class="s" font-size="32" fill="#e6f1f7" letter-spacing="-0.5">Anatomy of a <tspan class="si" fill="#6fe3f2">level.</tspan></text><line x1="40" y1="108" x2="1160" y2="108" stroke="#8fdcf0" stroke-opacity="0.14" stroke-width="1" stroke-linecap="round"/><rect x="40" y="130" width="520" height="452" rx="20" fill="#0a1622" stroke="#8fdcf0" stroke-width="1" stroke-opacity="0.16" /><text x="64" y="160" class="m" font-size="9.5" fill="#6fe3f2" letter-spacing="1.52" font-weight="500" xml:space="preserve" >SRC/QUESTIONS.TS</text><text x="64" y="194" class="m" font-size="12.5" fill="#dbe9f2" xml:space="preserve" >type Question = {</text><text x="64" y="222" class="m" font-size="12.5" fill="#dbe9f2" xml:space="preserve" >  id: number;</text><text x="536" y="222" class="m" font-size="9.8" fill="#5f7b8f" text-anchor="end" xml:space="preserve" >// 1 to 1000</text><text x="64" y="250" class="m" font-size="12.5" fill="#dbe9f2" xml:space="preserve" >  world: string;</text><text x="536" y="250" class="m" font-size="9.8" fill="#5f7b8f" text-anchor="end" xml:space="preserve" >// "EPISODE 01 · FIRST LIGHT"</text><text x="64" y="278" class="m" font-size="12.5" fill="#dbe9f2" xml:space="preserve" >  title: string;</text><text x="64" y="306" class="m" font-size="12.5" fill="#dbe9f2" xml:space="preserve" >  prompt: string;</text><text x="536" y="306" class="m" font-size="9.8" fill="#5f7b8f" text-anchor="end" xml:space="preserve" >// what the learner reads</text><text x="64" y="334" class="m" font-size="12.5" fill="#dbe9f2" xml:space="preserve" >  hint: string;</text><text x="536" y="334" class="m" font-size="9.8" fill="#5f7b8f" text-anchor="end" xml:space="preserve" >// shown on demand</text><text x="64" y="362" class="m" font-size="12.5" fill="#dbe9f2" xml:space="preserve" >  starter: string;</text><text x="536" y="362" class="m" font-size="9.8" fill="#5f7b8f" text-anchor="end" xml:space="preserve" >// initial editor text</text><text x="64" y="390" class="m" font-size="12.5" fill="#6fe3f2" xml:space="preserve" >  target: string;</text><text x="536" y="390" class="m" font-size="9.8" fill="#5f7b8f" text-anchor="end" xml:space="preserve" >// solution, 20 lines or fewer</text><text x="64" y="418" class="m" font-size="12.5" fill="#b79cff" xml:space="preserve" >  test?: string;</text><text x="536" y="418" class="m" font-size="9.8" fill="#5f7b8f" text-anchor="end" xml:space="preserve" >// probe appended to both runs</text><text x="64" y="446" class="m" font-size="12.5" fill="#ffcf86" xml:space="preserve" >  xp: number;</text><text x="536" y="446" class="m" font-size="9.8" fill="#5f7b8f" text-anchor="end" xml:space="preserve" >// essence on first solve</text><text x="64" y="474" class="m" font-size="12.5" fill="#dbe9f2" xml:space="preserve" >  topic?: string;</text><text x="536" y="474" class="m" font-size="9.8" fill="#5f7b8f" text-anchor="end" xml:space="preserve" >// shown in the level eyebrow</text><text x="64" y="502" class="m" font-size="12.5" fill="#dbe9f2" xml:space="preserve" >};</text><text x="64" y="556" class="b" font-size="11" fill="#9db2c1" xml:space="preserve" >Levels 1 to 20 are authored. Levels 21 to 1000 are generated.</text><rect x="600" y="130" width="176" height="140" rx="16" fill="#0a1622" stroke="#ffcf86" stroke-width="1" stroke-opacity="0.3" /><rect x="600" y="130" width="176" height="140" rx="16" fill="#ffcf86" fill-opacity="0.06" /><text x="614" y="154" class="m" font-size="8" fill="#ffcf86" letter-spacing="1.28" font-weight="500" xml:space="preserve" >AUTHORED</text><g transform="translate(744 140) scale(0.6667)" fill="none" stroke="#ffcf86" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></g><text x="614" y="178" class="m" font-size="10.5" fill="#e6f1f7" font-weight="500" xml:space="preserve" >openingQuestions</text><text x="614" y="198.0" class="b" font-size="10.3" fill="#9db2c1" xml:space="preserve" >Levels 1 to 20, written</text><text x="614" y="212.5" class="b" font-size="10.3" fill="#9db2c1" xml:space="preserve" >by hand with essence 10</text><text x="614" y="227.0" class="b" font-size="10.3" fill="#9db2c1" xml:space="preserve" >to 28.</text><rect x="792" y="130" width="176" height="140" rx="16" fill="#0a1622" stroke="#6fe3f2" stroke-width="1" stroke-opacity="0.3" /><rect x="792" y="130" width="176" height="140" rx="16" fill="#6fe3f2" fill-opacity="0.06" /><text x="806" y="154" class="m" font-size="8" fill="#6fe3f2" letter-spacing="1.28" font-weight="500" xml:space="preserve" >GENERATED</text><g transform="translate(936 140) scale(0.6667)" fill="none" stroke="#6fe3f2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.39 4.39a1 1 0 0 0 1.68-.474 2.5 2.5 0 1 1 3.014 3.015 1 1 0 0 0-.474 1.68l1.683 1.682a2.414 2.414 0 0 1 0 3.414L19.61 15.39a1 1 0 0 1-1.68-.474 2.5 2.5 0 1 0-3.014 3.015 1 1 0 0 1 .474 1.68l-1.683 1.682a2.414 2.414 0 0 1-3.414 0L8.61 19.61a1 1 0 0 0-1.68.474 2.5 2.5 0 1 1-3.014-3.015 1 1 0 0 0 .474-1.68l-1.683-1.682a2.414 2.414 0 0 1 0-3.414L4.39 8.61a1 1 0 0 1 1.68.474 2.5 2.5 0 1 0 3.014-3.015 1 1 0 0 1-.474-1.68l1.683-1.682a2.414 2.414 0 0 1 3.414 0z"/></g><text x="806" y="178" class="m" font-size="10.5" fill="#e6f1f7" font-weight="500" xml:space="preserve" >buildLevels(21, 1000)</text><text x="806" y="198.0" class="b" font-size="10.3" fill="#9db2c1" xml:space="preserve" >980 levels from 157</text><text x="806" y="212.5" class="b" font-size="10.3" fill="#9db2c1" xml:space="preserve" >puzzle families, seeded</text><text x="806" y="227.0" class="b" font-size="10.3" fill="#9db2c1" xml:space="preserve" >and deterministic.</text><rect x="984" y="130" width="176" height="140" rx="16" fill="#0a1622" stroke="#b79cff" stroke-width="1" stroke-opacity="0.3" /><rect x="984" y="130" width="176" height="140" rx="16" fill="#b79cff" fill-opacity="0.06" /><text x="998" y="154" class="m" font-size="8" fill="#b79cff" letter-spacing="1.28" font-weight="500" xml:space="preserve" >LABELLED</text><g transform="translate(1128 140) scale(0.6667)" fill="none" stroke="#b79cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></g><text x="998" y="178" class="m" font-size="10.5" fill="#e6f1f7" font-weight="500" xml:space="preserve" >worldOf(id)</text><text x="998" y="198.0" class="b" font-size="10.3" fill="#9db2c1" xml:space="preserve" >Every level gets its</text><text x="998" y="212.5" class="b" font-size="10.3" fill="#9db2c1" xml:space="preserve" >EPISODE NN · NAME</text><text x="998" y="227.0" class="b" font-size="10.3" fill="#9db2c1" xml:space="preserve" >eyebrow.</text><rect x="600" y="286" width="560" height="118" rx="18" fill="#0a1622" stroke="#8fdcf0" stroke-width="1" stroke-opacity="0.16" /><text x="618" y="312" class="m" font-size="8.5" fill="#6fe3f2" letter-spacing="1.36" font-weight="500" xml:space="preserve" >HOW A GENERATED LEVEL IS BUILT</text><circle cx="624" cy="332" r="2.2" fill="#6fe3f2" /><text x="636" y="335" class="m" font-size="10" fill="#dbe9f2" xml:space="preserve" >tier = min(10, floor(index / 98) + 1)</text><circle cx="624" cy="349" r="2.2" fill="#6fe3f2" /><text x="636" y="352" class="m" font-size="10" fill="#dbe9f2" xml:space="preserve" >seeded rng(id × 7919 + attempt × 104729 + tier)</text><circle cx="624" cy="366" r="2.2" fill="#6fe3f2" /><text x="636" y="369" class="m" font-size="10" fill="#dbe9f2" xml:space="preserve" >prompt must be unique, solution 20 lines or fewer</text><circle cx="624" cy="383" r="2.2" fill="#6fe3f2" /><text x="636" y="386" class="m" font-size="10" fill="#dbe9f2" xml:space="preserve" >essence = 10 + 2 × tier · title = adjective + noun</text><rect x="600" y="420" width="560" height="162" rx="18" fill="#0a1622" stroke="#6fe3f2" stroke-width="1" stroke-opacity="0.3" /><rect x="600" y="420" width="560" height="162" rx="18" fill="#6fe3f2" fill-opacity="0.06" /><text x="618" y="446" class="m" font-size="8.5" fill="#6fe3f2" letter-spacing="1.36" font-weight="500" xml:space="preserve" >EXAMPLE · LEVEL 12 · SMALLEST STAR</text><text x="618" y="468" class="b" font-size="11" fill="#9db2c1" xml:space="preserve" >Create a function called double that returns its input multiplied by 2.</text><rect x="618" y="482" width="300" height="62" rx="12" fill="#08121c" stroke="#8fdcf0" stroke-width="1" stroke-opacity="0.18" /><text x="632" y="506" class="m" font-size="12" fill="#b79cff" xml:space="preserve" >def double(n):</text><text x="632" y="528" class="m" font-size="12" fill="#dbe9f2" xml:space="preserve" >    return n * 2</text><rect x="934" y="482" width="208" height="62" rx="12" fill="#08121c" stroke="#8fdcf0" stroke-width="1" stroke-opacity="0.18" /><text x="948" y="506" class="m" font-size="8.5" fill="#7a91a2" letter-spacing="1" xml:space="preserve" >test</text><text x="948" y="528" class="m" font-size="11.5" fill="#6fe3f2" xml:space="preserve" >print(double(6))</text><text x="618" y="566" class="b" font-size="10.5" fill="#9db2c1">Both programs run with the probe and must print the same text: <tspan class="m" fill="#7df0c6" font-size="12" font-weight="500">12</tspan></text></svg>
