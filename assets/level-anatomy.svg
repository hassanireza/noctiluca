<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d"><title id="t">Anatomy of a Noctiluca level</title><desc id="d">The Question type with its fields, and level 12 as an example of a function level that uses a test probe.</desc><defs><style>.s{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-style:italic}.m{font-family:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}.b{font-family:'DM Sans','Segoe UI',Helvetica,Arial,sans-serif}</style><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#a8c8bb" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><radialGradient id="glow" cx="50%" cy="-10%" r="75%"><stop offset="0" stop-color="#1b2524"/><stop offset="0.55" stop-color="#090b0d" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1200" height="520" rx="6" fill="#090b0d" /><rect x="0" y="0" width="1200" height="520" rx="6" fill="url(#glow)" /><rect x="0.5" y="0.5" width="1199" height="519" rx="6" fill="none" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><text x="40" y="46" class="m" font-size="10" fill="#92ab9f" letter-spacing="1.7000000000000002" xml:space="preserve" >AUTHORING</text><text x="40" y="84" class="s" font-size="30" fill="#e8e5df" xml:space="preserve" >Anatomy of a level.</text><line x1="40" y1="104" x2="1160" y2="104" stroke="#dbe1e1" stroke-opacity="0.1" stroke-width="1"/><rect x="40" y="124" width="560" height="374" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><text x="64" y="152" class="m" font-size="9.5" fill="#92ab9f" letter-spacing="1.6150000000000002" xml:space="preserve" >SRC/QUESTIONS.TS</text><text x="64" y="186" class="m" font-size="12.5" fill="#abb2bf" xml:space="preserve" >type Question = {</text><text x="64" y="213" class="m" font-size="12.5" fill="#abb2bf" xml:space="preserve" >  id: number;</text><text x="560" y="213" class="m" font-size="10.5" fill="#5c6370" text-anchor="end" xml:space="preserve" >// 1 to 1000</text><text x="64" y="240" class="m" font-size="12.5" fill="#abb2bf" xml:space="preserve" >  world: string;</text><text x="560" y="240" class="m" font-size="10.5" fill="#5c6370" text-anchor="end" xml:space="preserve" >// episode label</text><text x="64" y="267" class="m" font-size="12.5" fill="#abb2bf" xml:space="preserve" >  title: string;</text><text x="64" y="294" class="m" font-size="12.5" fill="#abb2bf" xml:space="preserve" >  prompt: string;</text><text x="560" y="294" class="m" font-size="10.5" fill="#5c6370" text-anchor="end" xml:space="preserve" >// what the learner reads</text><text x="64" y="321" class="m" font-size="12.5" fill="#abb2bf" xml:space="preserve" >  hint: string;</text><text x="560" y="321" class="m" font-size="10.5" fill="#5c6370" text-anchor="end" xml:space="preserve" >// shown on demand</text><text x="64" y="348" class="m" font-size="12.5" fill="#abb2bf" xml:space="preserve" >  starter: string;</text><text x="560" y="348" class="m" font-size="10.5" fill="#5c6370" text-anchor="end" xml:space="preserve" >// initial editor text</text><text x="64" y="375" class="m" font-size="12.5" fill="#a8c8bb" xml:space="preserve" >  target: string;</text><text x="560" y="375" class="m" font-size="10.5" fill="#5c6370" text-anchor="end" xml:space="preserve" >// authored solution, 20 lines max</text><text x="64" y="402" class="m" font-size="12.5" fill="#a7b9cd" xml:space="preserve" >  test?: string;</text><text x="560" y="402" class="m" font-size="10.5" fill="#5c6370" text-anchor="end" xml:space="preserve" >// probe appended to both runs</text><text x="64" y="429" class="m" font-size="12.5" fill="#abb2bf" xml:space="preserve" >  xp: number;</text><text x="560" y="429" class="m" font-size="10.5" fill="#5c6370" text-anchor="end" xml:space="preserve" >// essence on first solve</text><text x="64" y="456" class="m" font-size="12.5" fill="#abb2bf" xml:space="preserve" >};</text><text x="64" y="486" class="b" font-size="11" fill="#777c7e" xml:space="preserve" >Levels 1 to 20 are authored. Levels 21 to 1000 come from makeQuestion().</text><rect x="640" y="124" width="520" height="374" rx="2" fill="#101316" stroke="#a8c8bb" stroke-width="1" stroke-opacity="0.28" /><text x="664" y="152" class="m" font-size="9.5" fill="#a8c8bb" letter-spacing="1.6150000000000002" xml:space="preserve" >EXAMPLE · LEVEL 12 · SMALLEST STAR</text><text x="664" y="184" class="m" font-size="10" fill="#75847b" xml:space="preserve" >prompt</text><text x="664" y="202" class="b" font-size="12" fill="#c9cdc9" xml:space="preserve" >Create a function called double that</text><text x="664" y="219" class="b" font-size="12" fill="#c9cdc9" xml:space="preserve" >returns its input multiplied by 2.</text><text x="664" y="256" class="m" font-size="10" fill="#75847b" xml:space="preserve" >target</text><rect x="664" y="266" width="472" height="58" rx="2" fill="#0e1114" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><text x="680" y="288" class="m" font-size="12" fill="#c678dd" xml:space="preserve" >def double(n):</text><text x="680" y="310" class="m" font-size="12" fill="#abb2bf" xml:space="preserve" >    return n * 2</text><text x="664" y="354" class="m" font-size="10" fill="#75847b" xml:space="preserve" >test</text><rect x="664" y="364" width="472" height="34" rx="2" fill="#0e1114" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><text x="680" y="386" class="m" font-size="12" fill="#61afef" xml:space="preserve" >print(double(6))</text><path d="M900 408 L900 430" fill="none" stroke="#a8c8bb" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)" /><text x="664" y="452" class="b" font-size="11.5" fill="#9b9f9d" xml:space="preserve" >Both your code and the target run with the probe.</text><text x="664" y="472" class="b" font-size="11.5" fill="#9b9f9d">The two outputs must match: <tspan class="m" fill="#a8c8bb" font-size="12">12</tspan></text></svg>
