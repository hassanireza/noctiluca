<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="t d"><title id="t">Noctiluca offline support and install</title><desc id="d">A service worker uses network first for pages, cache first for built assets and the Pyodide runtime from jsDelivr, so Python works offline after the first run. It also shows the install lifecycle, the install hint and the web app manifest.</desc><defs><style>.s{font-family:'Playfair Display',Georgia,'Times New Roman',serif}.si{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-style:italic}.m{font-family:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}.b{font-family:'DM Sans','Segoe UI',Helvetica,Arial,sans-serif}</style><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#6fe3f2" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker><radialGradient id="bgtop" cx="50%" cy="-10%" r="85%"><stop offset="0" stop-color="#0b3146"/><stop offset="0.6" stop-color="#0b3146" stop-opacity="0"/></radialGradient><radialGradient id="bgcorner" cx="100%" cy="100%" r="70%"><stop offset="0" stop-color="#0a2236"/><stop offset="1" stop-color="#0a2236" stop-opacity="0"/></radialGradient><radialGradient id="halo"><stop offset="0" stop-color="#3fd6f0" stop-opacity=".55"/><stop offset=".5" stop-color="#1b8fb0" stop-opacity=".16"/><stop offset="1" stop-color="#1b8fb0" stop-opacity="0"/></radialGradient><radialGradient id="cellg" cx="38%" cy="34%" r="75%"><stop offset="0" stop-color="#eafdff"/><stop offset=".38" stop-color="#7defff"/><stop offset="1" stop-color="#1a8fb4"/></radialGradient><linearGradient id="btn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9af4ff"/><stop offset="1" stop-color="#6fe3f2"/></linearGradient><linearGradient id="dock" x1="0" y1="0" x2="1" y2="0.4"><stop offset="0" stop-color="#0f4157"/><stop offset="1" stop-color="#0b2a3c"/></linearGradient><linearGradient id="meter" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2aa6c4"/><stop offset=".6" stop-color="#6fe3f2"/><stop offset="1" stop-color="#b9fbff"/></linearGradient></defs><rect x="0" y="0" width="1200" height="690" rx="14" fill="#04080f" /><rect x="0" y="0" width="1200" height="690" rx="14" fill="url(#bgtop)" /><rect x="0" y="0" width="1200" height="690" rx="14" fill="url(#bgcorner)" /><circle cx="958.8" cy="306.3" r="0.7" fill="#9cf3ff" fill-opacity="0.23" /><circle cx="90.6" cy="586.5" r="0.7" fill="#9cf3ff" fill-opacity="0.33" /><circle cx="414.9" cy="449.0" r="1.3" fill="#9cf3ff" fill-opacity="0.28" /><circle cx="114.9" cy="226.0" r="1.3" fill="#9cf3ff" fill-opacity="0.26" /><circle cx="833.1" cy="455.8" r="0.7" fill="#9cf3ff" fill-opacity="0.24" /><circle cx="935.5" cy="432.4" r="0.7" fill="#9cf3ff" fill-opacity="0.19" /><circle cx="598.2" cy="51.2" r="1.3" fill="#9cf3ff" fill-opacity="0.28" /><circle cx="83.2" cy="428.1" r="0.7" fill="#9cf3ff" fill-opacity="0.13" /><circle cx="810.9" cy="122.5" r="1" fill="#9cf3ff" fill-opacity="0.26" /><circle cx="434.7" cy="625.0" r="1" fill="#9cf3ff" fill-opacity="0.23" /><circle cx="493.5" cy="640.9" r="1" fill="#9cf3ff" fill-opacity="0.13" /><circle cx="603.9" cy="102.1" r="1" fill="#9cf3ff" fill-opacity="0.2" /><circle cx="1079.9" cy="394.6" r="2.2" fill="#9cf3ff" fill-opacity="0.31" /><circle cx="1029.3" cy="596.9" r="1" fill="#9cf3ff" fill-opacity="0.14" /><circle cx="1175.6" cy="437.7" r="0.7" fill="#9cf3ff" fill-opacity="0.34" /><circle cx="903.3" cy="509.0" r="1.7" fill="#9cf3ff" fill-opacity="0.14" /><circle cx="207.2" cy="51.0" r="1.7" fill="#9cf3ff" fill-opacity="0.13" /><circle cx="235.2" cy="378.7" r="1.3" fill="#9cf3ff" fill-opacity="0.27" /><circle cx="834.9" cy="88.2" r="2.2" fill="#9cf3ff" fill-opacity="0.27" /><circle cx="52.4" cy="200.5" r="1" fill="#9cf3ff" fill-opacity="0.13" /><circle cx="387.1" cy="677.8" r="0.7" fill="#9cf3ff" fill-opacity="0.21" /><circle cx="231.3" cy="131.9" r="1.7" fill="#9cf3ff" fill-opacity="0.32" /><circle cx="512.6" cy="13.4" r="2.2" fill="#9cf3ff" fill-opacity="0.19" /><circle cx="1009.7" cy="326.4" r="1.7" fill="#9cf3ff" fill-opacity="0.24" /><circle cx="936.7" cy="193.2" r="1.7" fill="#9cf3ff" fill-opacity="0.22" /><circle cx="1127.9" cy="509.6" r="0.7" fill="#9cf3ff" fill-opacity="0.13" /><circle cx="1152.2" cy="52.8" r="2.2" fill="#9cf3ff" fill-opacity="0.15" /><circle cx="365.6" cy="148.7" r="1" fill="#9cf3ff" fill-opacity="0.28" /><circle cx="285.4" cy="626.8" r="2.2" fill="#9cf3ff" fill-opacity="0.19" /><circle cx="1011.1" cy="10.2" r="0.7" fill="#9cf3ff" fill-opacity="0.14" /><circle cx="726.6" cy="436.8" r="1.7" fill="#9cf3ff" fill-opacity="0.2" /><circle cx="898.7" cy="571.1" r="1.7" fill="#9cf3ff" fill-opacity="0.13" /><circle cx="432.4" cy="27.9" r="1.7" fill="#9cf3ff" fill-opacity="0.17" /><circle cx="389.4" cy="49.9" r="1.3" fill="#9cf3ff" fill-opacity="0.13" /><circle cx="789.8" cy="11.0" r="1" fill="#9cf3ff" fill-opacity="0.27" /><circle cx="863.6" cy="435.7" r="1.3" fill="#9cf3ff" fill-opacity="0.17" /><circle cx="967.4" cy="219.6" r="2.2" fill="#9cf3ff" fill-opacity="0.2" /><circle cx="980.6" cy="65.8" r="1.3" fill="#9cf3ff" fill-opacity="0.32" /><circle cx="116.2" cy="158.0" r="1.7" fill="#9cf3ff" fill-opacity="0.18" /><circle cx="1019.1" cy="609.0" r="1" fill="#9cf3ff" fill-opacity="0.3" /><circle cx="905.4" cy="255.9" r="0.7" fill="#9cf3ff" fill-opacity="0.3" /><circle cx="274.9" cy="450.6" r="0.7" fill="#9cf3ff" fill-opacity="0.15" /><circle cx="231.3" cy="440.6" r="1.7" fill="#9cf3ff" fill-opacity="0.29" /><circle cx="1142.3" cy="626.7" r="1" fill="#9cf3ff" fill-opacity="0.18" /><circle cx="397.0" cy="338.2" r="1" fill="#9cf3ff" fill-opacity="0.29" /><circle cx="367.3" cy="11.3" r="0.7" fill="#9cf3ff" fill-opacity="0.22" /><circle cx="671.5" cy="382.3" r="0.7" fill="#9cf3ff" fill-opacity="0.27" /><circle cx="334.0" cy="106.8" r="1.3" fill="#9cf3ff" fill-opacity="0.21" /><circle cx="781.3" cy="650.5" r="2.2" fill="#9cf3ff" fill-opacity="0.22" /><circle cx="622.5" cy="132.2" r="1.7" fill="#9cf3ff" fill-opacity="0.16" /><circle cx="1002.5" cy="570.4" r="2.2" fill="#9cf3ff" fill-opacity="0.16" /><circle cx="1181.5" cy="123.1" r="1.3" fill="#9cf3ff" fill-opacity="0.18" /><circle cx="96.1" cy="603.3" r="1" fill="#9cf3ff" fill-opacity="0.17" /><circle cx="562.9" cy="21.1" r="1" fill="#9cf3ff" fill-opacity="0.19" /><circle cx="1087.0" cy="106.4" r="0.7" fill="#9cf3ff" fill-opacity="0.23" /><circle cx="610.7" cy="277.8" r="1.7" fill="#9cf3ff" fill-opacity="0.33" /><circle cx="989.0" cy="160.0" r="2.2" fill="#9cf3ff" fill-opacity="0.15" /><circle cx="831.0" cy="399.8" r="1.7" fill="#9cf3ff" fill-opacity="0.21" /><circle cx="678.2" cy="269.1" r="2.2" fill="#9cf3ff" fill-opacity="0.23" /><rect x="0.5" y="0.5" width="1199" height="689" rx="14" fill="none" stroke="#8fdcf0" stroke-width="1" stroke-opacity="0.18" /><text x="40" y="46" class="m" font-size="10" fill="#6fe3f2" letter-spacing="1.6" font-weight="500" xml:space="preserve" >OFFLINE AND INSTALL</text><text x="40" y="86" class="s" font-size="32" fill="#e6f1f7" letter-spacing="-0.5">Python keeps working <tspan class="si" fill="#6fe3f2">after the first run.</tspan></text><line x1="40" y1="108" x2="1160" y2="108" stroke="#8fdcf0" stroke-opacity="0.14" stroke-width="1" stroke-linecap="round"/><text x="40" y="140" class="m" font-size="8.5" fill="#7a91a2" letter-spacing="1.36" font-weight="500" xml:space="preserve" >REQUEST</text><text x="430" y="140" class="m" font-size="8.5" fill="#7a91a2" letter-spacing="1.36" font-weight="500" xml:space="preserve" >STRATEGY</text><text x="850" y="140" class="m" font-size="8.5" fill="#7a91a2" letter-spacing="1.36" font-weight="500" xml:space="preserve" >CACHE</text><rect x="40" y="154" width="340" height="66" rx="16" fill="#0a1622" stroke="#8fdcf0" stroke-width="1" stroke-opacity="0.16" /><text x="58" y="182" class="b" font-size="14" fill="#e6f1f7" font-weight="600" xml:space="preserve" >Page navigations</text><text x="58" y="202" class="m" font-size="9.5" fill="#7a91a2" xml:space="preserve" >the app itself</text><path d="M380 187 L424 187" fill="none" stroke="#6fe3f2" stroke-opacity="1" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="430" y="154" width="380" height="66" rx="16" fill="#0a1622" stroke="#8fdcf0" stroke-width="1" stroke-opacity="0.16" /><text x="448" y="180" class="m" font-size="10.5" fill="#6fe3f2" letter-spacing="1.4" font-weight="500" xml:space="preserve" >NETWORK FIRST</text><text x="448" y="198" class="b" font-size="10.2" fill="#9db2c1" xml:space="preserve" >A new deploy is picked up at once; the cached page is the</text><text x="448" y="211" class="b" font-size="10.2" fill="#9db2c1" xml:space="preserve" >offline fallback.</text><path d="M810 187 L844 187" fill="none" stroke="#6fe3f2" stroke-opacity="1" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="850" y="154" width="310" height="66" rx="16" fill="#0a1622" stroke="#8fb4ff" stroke-width="1" stroke-opacity="0.3" /><rect x="850" y="154" width="310" height="66" rx="16" fill="#8fb4ff" fill-opacity="0.06" /><g transform="translate(868 176) scale(0.8333)" fill="none" stroke="#8fb4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g><text x="898" y="192" class="m" font-size="11.5" fill="#e6f1f7" font-weight="500" xml:space="preserve" >noctiluca-shell-v2</text><rect x="40" y="236" width="340" height="66" rx="16" fill="#0a1622" stroke="#8fdcf0" stroke-width="1" stroke-opacity="0.16" /><text x="58" y="264" class="b" font-size="14" fill="#e6f1f7" font-weight="600" xml:space="preserve" >Built assets</text><text x="58" y="284" class="m" font-size="9.5" fill="#7a91a2" xml:space="preserve" >/assets/, png, svg, woff</text><path d="M380 269 L424 269" fill="none" stroke="#6fe3f2" stroke-opacity="1" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="430" y="236" width="380" height="66" rx="16" fill="#0a1622" stroke="#6fe3f2" stroke-width="1" stroke-opacity="0.3" /><rect x="430" y="236" width="380" height="66" rx="16" fill="#6fe3f2" fill-opacity="0.06" /><text x="448" y="262" class="m" font-size="10.5" fill="#6fe3f2" letter-spacing="1.4" font-weight="500" xml:space="preserve" >CACHE FIRST</text><text x="448" y="280" class="b" font-size="10.2" fill="#9db2c1" xml:space="preserve" >Hashed build files never change, so the cache answers</text><text x="448" y="293" class="b" font-size="10.2" fill="#9db2c1" xml:space="preserve" >instantly.</text><path d="M810 269 L844 269" fill="none" stroke="#6fe3f2" stroke-opacity="1" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="850" y="236" width="310" height="66" rx="16" fill="#0a1622" stroke="#8fb4ff" stroke-width="1" stroke-opacity="0.3" /><rect x="850" y="236" width="310" height="66" rx="16" fill="#8fb4ff" fill-opacity="0.06" /><g transform="translate(868 258) scale(0.8333)" fill="none" stroke="#8fb4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g><text x="898" y="274" class="m" font-size="11.5" fill="#e6f1f7" font-weight="500" xml:space="preserve" >noctiluca-shell-v2</text><rect x="40" y="318" width="340" height="66" rx="16" fill="#0a1622" stroke="#8fdcf0" stroke-width="1" stroke-opacity="0.16" /><text x="58" y="346" class="b" font-size="14" fill="#e6f1f7" font-weight="600" xml:space="preserve" >Pyodide runtime</text><text x="58" y="366" class="m" font-size="9.5" fill="#7a91a2" xml:space="preserve" >cdn.jsdelivr.net/pyodide/</text><path d="M380 351 L424 351" fill="none" stroke="#6fe3f2" stroke-opacity="1" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="430" y="318" width="380" height="66" rx="16" fill="#0a1622" stroke="#6fe3f2" stroke-width="1" stroke-opacity="0.3" /><rect x="430" y="318" width="380" height="66" rx="16" fill="#6fe3f2" fill-opacity="0.06" /><text x="448" y="344" class="m" font-size="10.5" fill="#6fe3f2" letter-spacing="1.4" font-weight="500" xml:space="preserve" >CACHE FIRST</text><text x="448" y="362" class="b" font-size="10.2" fill="#9db2c1" xml:space="preserve" >Versioned and immutable. After one launch, Python runs</text><text x="448" y="375" class="b" font-size="10.2" fill="#9db2c1" xml:space="preserve" >offline.</text><path d="M810 351 L844 351" fill="none" stroke="#6fe3f2" stroke-opacity="1" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="850" y="318" width="310" height="66" rx="16" fill="#0a1622" stroke="#ff9ec2" stroke-width="1" stroke-opacity="0.3" /><rect x="850" y="318" width="310" height="66" rx="16" fill="#ff9ec2" fill-opacity="0.06" /><g transform="translate(868 340) scale(0.8333)" fill="none" stroke="#ff9ec2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g><text x="898" y="356" class="m" font-size="11.5" fill="#e6f1f7" font-weight="500" xml:space="preserve" >noctiluca-runtime-v2</text><rect x="40" y="400" width="340" height="66" rx="16" fill="#0a1622" stroke="#8fdcf0" stroke-width="1" stroke-opacity="0.16" /><text x="58" y="428" class="b" font-size="14" fill="#e6f1f7" font-weight="600" xml:space="preserve" >Everything else</text><text x="58" y="448" class="m" font-size="9.5" fill="#7a91a2" xml:space="preserve" >other same-origin GETs</text><path d="M380 433 L424 433" fill="none" stroke="#6fe3f2" stroke-opacity="1" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="430" y="400" width="380" height="66" rx="16" fill="#0a1622" stroke="#8fdcf0" stroke-width="1" stroke-opacity="0.16" /><text x="448" y="426" class="m" font-size="10.5" fill="#6fe3f2" letter-spacing="1.4" font-weight="500" xml:space="preserve" >NETWORK FIRST</text><text x="448" y="444" class="b" font-size="10.2" fill="#9db2c1" xml:space="preserve" >Fresh when online, cached when not.</text><path d="M810 433 L844 433" fill="none" stroke="#6fe3f2" stroke-opacity="1" stroke-width="1.4" stroke-linecap="round" marker-end="url(#ar)"/><rect x="850" y="400" width="310" height="66" rx="16" fill="#0a1622" stroke="#8fb4ff" stroke-width="1" stroke-opacity="0.3" /><rect x="850" y="400" width="310" height="66" rx="16" fill="#8fb4ff" fill-opacity="0.06" /><g transform="translate(868 422) scale(0.8333)" fill="none" stroke="#8fb4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g><text x="898" y="438" class="m" font-size="11.5" fill="#e6f1f7" font-weight="500" xml:space="preserve" >noctiluca-shell-v2</text><text x="40" y="492" class="m" font-size="8.5" fill="#7a91a2" letter-spacing="1.36" font-weight="500" xml:space="preserve" >AROUND IT</text><rect x="40" y="500" width="360" height="150" rx="16" fill="#0a1622" stroke="#7fd0ff" stroke-width="1" stroke-opacity="0.3" /><rect x="40" y="500" width="360" height="150" rx="16" fill="#7fd0ff" fill-opacity="0.06" /><text x="58" y="528" class="m" font-size="8.5" fill="#7fd0ff" letter-spacing="1.36" font-weight="500" xml:space="preserve" >LIFECYCLE</text><g transform="translate(362 514) scale(0.7500)" fill="none" stroke="#7fd0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></g><text x="58" y="552" class="m" font-size="12" fill="#e6f1f7" font-weight="500" xml:space="preserve" >install</text><text x="58" y="574" class="b" font-size="10.6" fill="#9db2c1" xml:space="preserve" >Precaches the scope, manifest and icon, then</text><text x="58" y="589" class="b" font-size="10.6" fill="#9db2c1" xml:space="preserve" >skipWaiting. On activate, old caches are deleted and</text><text x="58" y="604" class="b" font-size="10.6" fill="#9db2c1" xml:space="preserve" >clients are claimed. Registered in production builds</text><text x="58" y="619" class="b" font-size="10.6" fill="#9db2c1" xml:space="preserve" >only.</text><rect x="420" y="500" width="360" height="150" rx="16" fill="#0a1622" stroke="#8fb4ff" stroke-width="1" stroke-opacity="0.3" /><rect x="420" y="500" width="360" height="150" rx="16" fill="#8fb4ff" fill-opacity="0.06" /><text x="438" y="528" class="m" font-size="8.5" fill="#8fb4ff" letter-spacing="1.36" font-weight="500" xml:space="preserve" >INSTALL HINT</text><g transform="translate(742 514) scale(0.7500)" fill="none" stroke="#8fb4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></g><text x="438" y="552" class="m" font-size="12" fill="#e6f1f7" font-weight="500" xml:space="preserve" >after 5 s on the map</text><text x="438" y="574" class="b" font-size="10.6" fill="#9db2c1" xml:space="preserve" >iOS shows Share, then Add to Home Screen. Chromium</text><text x="438" y="589" class="b" font-size="10.6" fill="#9db2c1" xml:space="preserve" >offers the real install prompt. Dismissing it snoozes</text><text x="438" y="604" class="b" font-size="10.6" fill="#9db2c1" xml:space="preserve" >the hint for 14 days.</text><rect x="800" y="500" width="360" height="150" rx="16" fill="#0a1622" stroke="#7df0c6" stroke-width="1" stroke-opacity="0.3" /><rect x="800" y="500" width="360" height="150" rx="16" fill="#7df0c6" fill-opacity="0.06" /><text x="818" y="528" class="m" font-size="8.5" fill="#7df0c6" letter-spacing="1.36" font-weight="500" xml:space="preserve" >MANIFEST</text><g transform="translate(1122 514) scale(0.7500)" fill="none" stroke="#7df0c6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></g><text x="818" y="552" class="m" font-size="12" fill="#e6f1f7" font-weight="500" xml:space="preserve" >standalone</text><text x="818" y="574" class="b" font-size="10.6" fill="#9db2c1" xml:space="preserve" >Portrait, theme and background #04080f, with 192 and</text><text x="818" y="589" class="b" font-size="10.6" fill="#9db2c1" xml:space="preserve" >512 icons plus a maskable 512 for Android.</text></svg>
