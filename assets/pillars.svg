<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d"><title id="t">The Noctiluca loop</title><desc id="d">Three pillars: the path of one thousand levels, the CodeMirror editor, and the Pyodide runtime that checks your output.</desc><defs><style>.s{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-style:italic}.m{font-family:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}.b{font-family:'DM Sans','Segoe UI',Helvetica,Arial,sans-serif}</style><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#a8c8bb" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><radialGradient id="glow" cx="50%" cy="-10%" r="75%"><stop offset="0" stop-color="#1b2524"/><stop offset="0.55" stop-color="#090b0d" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1200" height="440" rx="6" fill="#090b0d" /><rect x="0" y="0" width="1200" height="440" rx="6" fill="url(#glow)" /><rect x="0.5" y="0.5" width="1199" height="439" rx="6" fill="none" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><text x="40" y="46" class="m" font-size="10" fill="#92ab9f" letter-spacing="1.7000000000000002" xml:space="preserve" >THE IDEA</text><text x="40" y="84" class="s" font-size="30" fill="#e8e5df" xml:space="preserve" >One loop: read, trace, run.</text><line x1="40" y1="104" x2="1160" y2="104" stroke="#dbe1e1" stroke-opacity="0.1" stroke-width="1"/><rect x="40" y="124" width="353" height="276" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><rect x="423" y="124" width="353" height="276" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><rect x="806" y="124" width="353" height="276" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><g transform="translate(60 144) scale(0.7500)