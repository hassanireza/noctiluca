e-linejoin="round" /><rect x="140.5" y="240" width="24" height="24" rx="2" fill="#16201b" stroke="#a8c8bb" stroke-width="1" stroke-opacity="0.45" /><path d="M147.5 252.5 l3.4 3.4 l6-7" fill="none" stroke="#a8c8bb" stroke-width="1.3" stroke-opacity="1" stroke-linecap="round" stroke-linejoin="round" /><rect x="172.5" y="240" width="24" height="24" rx="2" fill="#16201b" stroke="#a8c8bb" stroke-width="1" stroke-opacity="0.45" /><path d="M179.5 252.5 l3.4 3.4 l6-7" fill="none" stroke="#a8c8bb" stroke-width="1.3" stroke-opacity="1" stroke-linecap="round" stroke-linejoin="round" /><rect x="204.5" y="240" width="24" height="24" rx="2" fill="#16201b" stroke="#a8c8bb" stroke-width="1" stroke-opacity="0.45" /><path d="M211.5 252.5 l3.4 3.4 l6-7" fill="none" stroke="#a8c8bb" stroke-width="1.3" stroke-opacity="1" stroke-linecap="round" stroke-linejoin="round" /><rect x="236.5" y="240" width="24" height="24" rx="2" fill="#16201b" stroke="#a8c8bb" stroke-width="1" stroke-opacity="0.45" /><path d="M243.5 252.5 l3.4 3.4 l6-7" fill="none" stroke="#a8c8bb" stroke-width="1.3" stroke-opacity="1" stroke-linecap="round" stroke-linejoin="round" /><rect x="268.5" y="240" width="24" height="24" rx="2" fill="#16201b" stroke="#a8c8bb" stroke-width="1" stroke-opacity="0.45" /><path d="M275.5 252.5 l3.4 3.4 l6-7" fill="none" stroke="#a8c8bb" stroke-width="1.3" stroke-opacity="1" stroke-linecap="round" stroke-linejoin="round" /><text x="64" y="292" class="m" font-size="10" fill="#92ab9f" letter-spacing="1.7000000000000002" xml:space="preserve" >01 · THE PATH</text><text x="64" y="320" class="s" font-size="21" fill="#e8e5df" xml:space="preserve" >A thousand small levels</text><text x="64" y="344" class="b" font-size="12" fill="#9b9f9d" xml:space="preserve" >Fifty episodes of twenty. Open any level at any</text><text x="64" y="361" class="b" font-size="12" fill="#9b9f9d" xml:space="preserve" >time; the map starts at level 001.</text><g transform="translate(443 144) scale(0.7500)" fill="none" stroke="#a8c8bb" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/></g><rect x="447" y="174" width="305" height="96" rx="2" fill="#0e1114" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.12" /><text x="459" y="198" class="m" font-size="10" fill="#505956" xml:space="preserve" >1</text><text x="479" y="198" class="m" font-size="11" xml:space="preserve"><tspan fill="#c678dd" xml:space="preserve">for</tspan><tspan fill="#abb2bf" xml:space="preserve"> i </tspan><tspan fill="#c678dd" xml:space="preserve">in</tspan><tspan fill="#abb2bf" xml:space="preserve"> </tspan><tspan fill="#61afef" xml:space="preserve">range</tspan><tspan fill="#abb2bf" xml:space="preserve">(</tspan><tspan fill="#d19a66" xml:space="preserve">1</tspan><tspan fill="#abb2bf" xml:space="preserve">, </tspan><tspan fill="#d19a66" xml:space="preserve">6</tspan><tspan fill="#abb2bf" xml:space="preserve">):</tspan></text><text x="459" y="218" class="m" font-size="10" fill="#505956" xml:space="preserve" >2</text><text x="479" y="218" class="m" font-size="11" xml:space="preserve"><tspan fill="#abb2bf" xml:space="preserve">    </tspan><tspan fill="#61afef" xml:space="preserve">print</tspan><tspan fill="#abb2bf" xml:space="preserve">(i)</tspan></text><rect x="457" y="238" width="34" height="22" rx="3" fill="#171c1f" stroke="#262e2b" stroke-width="1" /><text x="474.0" y="253" class="m" font-size="11" fill="#b4d0c0" text-anchor="middle" xml:space="preserve" >↳</text><rect x="496" y="238" width="24" height="22" rx="3" fill="#171c1f" stroke="#262e2b" stroke-width="1" /><text x="508.0" y="253" class="m" font-size="11" fill="#c7d0ca" text-anchor="middle" xml:space="preserve" >=</text><rect x="525" y="238" width="24" height="22" rx="3" fill="#171c1f" stroke="#262e2b" stroke-width="1" /><text x="537.0" y="253" class="m" font-size="11" fill="#c7d0ca" text-anchor="middle" xml:space="preserve" >(</text><rect x="554" y="238" width="24" height="22" rx="3" fill="#171c1f" stroke="#262e2b" stroke-width="1" /><text x="566.0" y="253" class="m" font-size="11" fill="#c7d0ca" text-anchor="middle" xml:space="preserve" >)</text><rect x="583" y="238" width="24" height="22" rx="3" fill="#171c1f" stroke="#262e2b" stroke-width="1" /><text x="595.0" y="253" class="m" font-size="11" fill="#c7d0ca" text-anchor="middle" xml:space="preserve" >:</text><rect x="612" y="238" width="24" height="22" rx="3" fill="#171c1f" stroke="#262e2b" stroke-width="1" /><text x="624.0" y="253" class="m" font-size="11" fill="#c7d0ca" text-anchor="middle" xml:space="preserve" >"</text><rect x="641" y="238" width="24" height="22" rx="3" fill="#171c1f" stroke="#262e2b" stroke-width="1" /><text x="653.0" y="253" class="m" font-size="11" fill="#c7d0ca" text-anchor="middle" xml:space="preserve" >[</text><rect x="670" y="238" width="24" height="22" rx="3" fill="#171c1f" stroke="#262e2b" stroke-width="1" /><text x="682.0" y="253" class="m" font-size="11" fill="#c7d0ca" text-anchor="middle" xml:space="preserve" >]</text><text x="447" y="292" class="m" font-size="10" fill="#92ab9f" letter-spacing="1.7000000000000002" xml:space="preserve" >02 · THE TRACE</text><text x="447" y="320" class="s" font-size="21" fill="#e8e5df" xml:space="preserve" >Write real Python</text><text x="447" y="344" class="b" font-size="12" fill="#9b9f9d" xml:space="preserve" >CodeMirror 6 with line numbers, an indent button</text><text x="447" y="361" class="b" font-size="12" fill="#9b9f9d" xml:space="preserve" >and a touch key row for the symbols phones hide.</text><g transform="translate(826 144) scale(0.7500)" fill="none" stroke="#a8c8bb" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"/></g><rect x="830" y="178" width="118" height="72" rx="2" fill="#0e1114" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.12" /><text x="840" y="196" class="m" font-size="8" fill="#75847b" letter-spacing="1.36" xml:space="preserve" >ACTUAL</text><text x="840" y="218" class="m" font-size="12" fill="#d3ded4" xml:space="preserve" >1 2 3 4 5</text><text x="840" y="236" class="m" font-size="9" fill="#5d6962" xml:space="preserve" >your code</text><rect x="1017" y="178" width="118" height="72" rx="2" fill="#0e1114" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.12" /><text x="1027" y="196" class="m" font-size="8" fill="#75847b" letter-spacing="1.36" xml:space="preserve" >EXPECTED</text><text x="1027" y="218" class="m" font-size="12" fill="#d3ded4" xml:space="preserve" >1 2 3 4 5</text><text x="1027" y="236" class="m" font-size="9" fill="#5d6962" xml:space="preserve" >authored solution</text><circle cx="982.5" cy="214" r="15" fill="#16201b" stroke="#a8c8bb" stroke-width="1.2" stroke-opacity="0.6" /><path d="M976.5 214.5 l4.2 4.2 l7.6-8.6" fill="none" stroke="#a8c8bb" stroke-width="1.5" stroke-opacity="1" stroke-linecap="round" stroke-linejoin="round" /><text x="830" y="292" class="m" font-size="10" fill="#92ab9f" letter-spacing="1.7000000000000002" xml:space="preserve" >03 · THE RUN</text><text x="830" y="320" class="s" font-size="21" fill="#e8e5df" xml:space="preserve" >Executed on your device</text><text x="830" y="344" class="b" font-size="12" fill="#9b9f9d" xml:space="preserve" >Pyodide runs CPython in a Web Worker and compares</text><text x="830" y="361" class="b" font-size="12" fill="#9b9f9d" xml:space="preserve" >your output with the authored one.</text><text x="600.0" y="418" class="m" font-size="10" fill="#75847b" text-anchor="middle" letter-spacing="1.2" xml:space="preserve" >Your code is never sent to a server.</text></svg>
