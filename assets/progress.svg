<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d"><title id="t">Noctiluca progression</title><desc id="d">Essence per level is ten plus two times the tier, 12 to 30. The day streak increases on consecutive days, holds on the same day and resets otherwise.</desc><defs><style>.s{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-style:italic}.m{font-family:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}.b{font-family:'DM Sans','Segoe UI',Helvetica,Arial,sans-serif}</style><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#a8c8bb" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><radialGradient id="glow" cx="50%" cy="-10%" r="75%"><stop offset="0" stop-color="#1b2524"/><stop offset="0.55" stop-color="#090b0d" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1200" height="440" rx="6" fill="#090b0d" /><rect x="0" y="0" width="1200" height="440" rx="6" fill="url(#glow)" /><rect x="0.5" y="0.5" width="1199" height="439" rx="6" fill="none" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><text x="40" y="46" class="m" font-size="10" fill="#92ab9f" letter-spacing="1.7000000000000002" xml:space="preserve" >PROGRESSION</text><text x="40" y="84" class="s" font-size="30" fill="#e8e5df" xml:space="preserve" >Essence and the day streak.</text><line x1="40" y1="104" x2="1160" y2="104" stroke="#dbe1e1" stroke-opacity="0.1" stroke-width="1"/><rect x="40" y="124" width="540" height="280" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><text x="64" y="152" class="m" font-size="9.5" fill="#a8c8bb" letter-spacing="1.6150000000000002" xml:space="preserve" >ESSENCE PER LEVEL</text><text x="64" y="184" class="m" font-size="20" fill="#d3ded4" xml:space="preserve" >10 + 2 × tier</text><rect x="64" y="306.0" width="38" height="40.0" rx="1" fill="#a8c8bb" stroke="#a8c8bb" stroke-width="1" stroke-opacity="0.6" fill-opacity="0.16" /><text x="83" y="299.0" class="m" font-size="10" fill="#a8c8bb" text-anchor="middle" xml:space="preserve" >12</text><text x="83" y="362" class="m" font-size="9" fill="#75847b" text-anchor="middle" xml:space="preserve" >T1</text><rect x="113" y="299.3333333333333" width="38" height="46.666666666666664" rx="1" fill="#a7b9cd" stroke="#a7b9cd" stroke-width="1" stroke-opacity="0.6" fill-opacity="0.16" /><text x="132" y="292.3333333333333" class="m" font-size="10" fill="#a7b9cd" text-anchor="middle" xml:space="preserve" >14</text><text x="132" y="362" class="m" font-size="9" fill="#75847b" text-anchor="middle" xml:space="preserve" >T2</text><rect x="162" y="292.6666666666667" width="38" height="53.333333333333336" rx="1" fill="#b6a8c8" stroke="#b6a8c8" stroke-width="1" stroke-opacity="0.6" fill-opacity="0.16" /><text x="181" y="285.6666666666667" class="m" font-size="10" fill="#b6a8c8" text-anchor="middle" xml:space="preserve" >16</text><text x="181" y="362" class="m" font-size="9" fill="#75847b" text-anchor="middle" xml:space="preserve" >T3</text><rect x="211" y="286.0" width="38" height="60.0" rx="1" fill="#c6a7a7" stroke="#c6a7a7" stroke-width="1" stroke-opacity="0.6" fill-opacity="0.16" /><text x="230" y="279.0" class="m" font-size="10" fill="#c6a7a7" text-anchor="middle" xml:space="preserve" >18</text><text x="230" y="362" class="m" font-size="9" fill="#75847b" text-anchor="middle" xml:space="preserve" >T4</text><rect x="260" y="279.33333333333337" width="38" height="66.66666666666666" rx="1" fill="#c7b68e" stroke="#c7b68e" stroke-width="1" stroke-opacity="0.6" fill-opacity="0.16" /><text x="279" y="272.33333333333337" class="m" font-size="10" fill="#c7b68e" text-anchor="middle" xml:space="preserve" >20</text><text x="279" y="362" class="m" font-size="9" fill="#75847b" text-anchor="middle" xml:space="preserve" >T5</text><rect x="309" y="272.6666666666667" width="38" height="73.33333333333333" rx="1" fill="#91b6b4" stroke="#91b6b4" stroke-width="1" stroke-opacity="0.6" fill-opacity="0.16" /><text x="328" y="265.6666666666667" class="m" font-size="10" fill="#91b6b4" text-anchor="middle" xml:space="preserve" >22</text><text x="328" y="362" class="m" font-size="9" fill="#75847b" text-anchor="middle" xml:space="preserve" >T6</text><rect x="358" y="266.0" width="38" height="80.0" rx="1" fill="#c49cae" stroke="#c49cae" stroke-width="1" stroke-opacity="0.6" fill-opacity="0.16" /><text x="377" y="259.0" class="m" font-size="10" fill="#c49cae" text-anchor="middle" xml:space="preserve" >24</text><text x="377" y="362" class="m" font-size="9" fill="#75847b" text-anchor="middle" xml:space="preserve" >T7</text><rect x="407" y="259.3333333333333" width="38" height="86.66666666666667" rx="1" fill="#99a9c8" stroke="#99a9c8" stroke-width="1" stroke-opacity="0.6" fill-opacity="0.16" /><text x="426" y="252.33333333333331" class="m" font-size="10" fill="#99a9c8" text-anchor="middle" xml:space="preserve" >26</text><text x="426" y="362" class="m" font-size="9" fill="#75847b" text-anchor="middle" xml:space="preserve" >T8</text><rect x="456" y="252.66666666666669" width="38" height="93.33333333333333" rx="1" fill="#b4a9a0" stroke="#b4a9a0" stroke-width="1" stroke-opacity="0.6" fill-opacity="0.16" /><text x="475" y="245.66666666666669" class="m" font-size="10" fill="#b4a9a0" text-anchor="middle" xml:space="preserve" >28</text><text x="475" y="362" class="m" font-size="9" fill="#75847b" text-anchor="middle" xml:space="preserve" >T9</text><rect x="505" y="246.0" width="38" height="100.0" rx="1" fill="#a8bd91" stroke="#a8bd91" stroke-width="1" stroke-opacity="0.6" fill-opacity="0.16" /><text x="524" y="239.0" class="m" font-size="10" fill="#a8bd91" text-anchor="middle" xml:space="preserve" >30</text><text x="524" y="362" class="m" font-size="9" fill="#75847b" text-anchor="middle" xml:space="preserve" >T10</text><line x1="64" y1="346" x2="556" y2="346" stroke="#dbe1e1" stroke-opacity="0.16" stroke-width="1"/><text x="64" y="392" class="b" font-size="11" fill="#777c7e" xml:space="preserve" >21,090 essence across all 1,000 levels. Levels 1 to 20 are hand-tuned at 10 to 28.</text><rect x="620" y="124" width="540" height="280" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><text x="644" y="152" class="m" font-size="9.5" fill="#a8c8bb" letter-spacing="1.6150000000000002" xml:space="preserve" >DAY STREAK · ON A FIRST SOLVE</text><rect x="644" y="172" width="492" height="58" rx="2" fill="#0e1114" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.12" /><circle cx="664" cy="201" r="4" fill="#a8c8bb" /><text x="682" y="197" class="m" font-size="10" fill="#a8c8bb" letter-spacing="1.4" xml:space="preserve" >NEXT DAY</text><text x="682" y="217" class="b" font-size="11.5" fill="#9b9f9d" xml:space="preserve" >Solved the day after your last solve</text><text x="1120" y="207" class="m" font-size="12" fill="#d3ded4" text-anchor="end" xml:space="preserve" >streak + 1</text><rect x="644" y="242" width="492" height="58" rx="2" fill="#0e1114" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.12" /><circle cx="664" cy="271" r="4" fill="#a7b9cd" /><text x="682" y="267" class="m" font-size="10" fill="#a7b9cd" letter-spacing="1.4" xml:space="preserve" >SAME DAY</text><text x="682" y="287" class="b" font-size="11.5" fill="#9b9f9d" xml:space="preserve" >Solved again on the same day</text><text x="1120" y="277" class="m" font-size="12" fill="#d3ded4" text-anchor="end" xml:space="preserve" >unchanged</text><rect x="644" y="312" width="492" height="58" rx="2" fill="#0e1114" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.12" /><circle cx="664" cy="341" r="4" fill="#c6a7a7" /><text x="682" y="337" class="m" font-size="10" fill="#c6a7a7" letter-spacing="1.4" xml:space="preserve" >GAP OR FIRST</text><text x="682" y="357" class="b" font-size="11.5" fill="#9b9f9d" xml:space="preserve" >Anything longer, or your first ever solve</text><text x="1120" y="347" class="m" font-size="12" fill="#d3ded4" text-anchor="end" xml:space="preserve" >resets to 1</text><text x="644" y="392" class="b" font-size="11" fill="#777c7e" xml:space="preserve" >Days are UTC dates. Re-solving a finished level awards nothing.</text></svg>
