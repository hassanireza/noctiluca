<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d"><title id="t">Noctiluca execution flow</title><desc id="d">Eight steps from tapping Run to saving progress: spawn the worker, post the message, load Pyodide, run your code, run the authored target, compare outputs, reply and record progress. Errors and timeouts have their own paths.</desc><defs><style>.s{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-style:italic}.m{font-family:'DM Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}.b{font-family:'DM Sans','Segoe UI',Helvetica,Arial,sans-serif}</style><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L8.5 5L1 8.5" fill="none" stroke="#a8c8bb" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></marker><radialGradient id="glow" cx="50%" cy="-10%" r="75%"><stop offset="0" stop-color="#1b2524"/><stop offset="0.55" stop-color="#090b0d" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1200" height="660" rx="6" fill="#090b0d" /><rect x="0" y="0" width="1200" height="660" rx="6" fill="url(#glow)" /><rect x="0.5" y="0.5" width="1199" height="659" rx="6" fill="none" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><text x="40" y="46" class="m" font-size="10" fill="#92ab9f" letter-spacing="1.7000000000000002" xml:space="preserve" >EXECUTION</text><text x="40" y="84" class="s" font-size="30" fill="#e8e5df" xml:space="preserve" >What happens when you tap Run.</text><line x1="40" y1="104" x2="1160" y2="104" stroke="#dbe1e1" stroke-opacity="0.1" stroke-width="1"/><rect x="40" y="128" width="250" height="126" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><circle cx="64" cy="154" r="11" fill="none" stroke="#a8c8bb" stroke-width="1.1" stroke-opacity="0.6" /><text x="64" y="158" class="m" font-size="10.5" fill="#a8c8bb" text-anchor="middle" xml:space="preserve" >1</text><text x="86" y="158" class="m" font-size="12.5" fill="#d3ded4" xml:space="preserve" >Tap RUN CODE</text><text x="56" y="186" class="b" font-size="11.2" fill="#9b9f9d" xml:space="preserve" >App.run() reuses one module worker,</text><text x="56" y="202" class="b" font-size="11.2" fill="#9b9f9d" xml:space="preserve" >or creates it, and arms a 120 second</text><text x="56" y="218" class="b" font-size="11.2" fill="#9b9f9d" xml:space="preserve" >timeout.</text><rect x="330" y="128" width="250" height="126" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><circle cx="354" cy="154" r="11" fill="none" stroke="#a8c8bb" stroke-width="1.1" stroke-opacity="0.6" /><text x="354" y="158" class="m" font-size="10.5" fill="#a8c8bb" text-anchor="middle" xml:space="preserve" >2</text><text x="376" y="158" class="m" font-size="12.5" fill="#d3ded4" xml:space="preserve" >postMessage</text><text x="346" y="186" class="b" font-size="11.2" fill="#9b9f9d" xml:space="preserve" >A message with code, target and test</text><text x="346" y="202" class="b" font-size="11.2" fill="#9b9f9d" xml:space="preserve" >goes to python.worker.ts. The UI</text><text x="346" y="218" class="b" font-size="11.2" fill="#9b9f9d" xml:space="preserve" >says the runtime is loading.</text><rect x="620" y="128" width="250" height="126" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><circle cx="644" cy="154" r="11" fill="none" stroke="#a8c8bb" stroke-width="1.1" stroke-opacity="0.6" /><text x="644" y="158" class="m" font-size="10.5" fill="#a8c8bb" text-anchor="middle" xml:space="preserve" >3</text><text x="666" y="158" class="m" font-size="12.5" fill="#d3ded4" xml:space="preserve" >loadPyodide()</text><text x="636" y="186" class="b" font-size="11.2" fill="#9b9f9d" xml:space="preserve" >The first run downloads Pyodide from</text><text x="636" y="202" class="b" font-size="11.2" fill="#9b9f9d" xml:space="preserve" >jsDelivr. Later runs in the session</text><text x="636" y="218" class="b" font-size="11.2" fill="#9b9f9d" xml:space="preserve" >reuse it.</text><rect x="910" y="128" width="250" height="126" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><circle cx="934" cy="154" r="11" fill="none" stroke="#a8c8bb" stroke-width="1.1" stroke-opacity="0.6" /><text x="934" y="158" class="m" font-size="10.5" fill="#a8c8bb" text-anchor="middle" xml:space="preserve" >4</text><text x="956" y="158" class="m" font-size="12.5" fill="#d3ded4" xml:space="preserve" >Run your code</text><text x="926" y="186" class="b" font-size="11.2" fill="#9b9f9d" xml:space="preserve" >stdout and stderr are captured. A</text><text x="926" y="202" class="b" font-size="11.2" fill="#9b9f9d" xml:space="preserve" >test probe is appended for function</text><text x="926" y="218" class="b" font-size="11.2" fill="#9b9f9d" xml:space="preserve" >levels.</text><rect x="40" y="296" width="250" height="126" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><circle cx="64" cy="322" r="11" fill="none" stroke="#a8c8bb" stroke-width="1.1" stroke-opacity="0.6" /><text x="64" y="326" class="m" font-size="10.5" fill="#a8c8bb" text-anchor="middle" xml:space="preserve" >5</text><text x="86" y="326" class="m" font-size="12.5" fill="#d3ded4" xml:space="preserve" >Run the target</text><text x="56" y="354" class="b" font-size="11.2" fill="#9b9f9d" xml:space="preserve" >The buffer is reset and the authored</text><text x="56" y="370" class="b" font-size="11.2" fill="#9b9f9d" xml:space="preserve" >solution runs through the same</text><text x="56" y="386" class="b" font-size="11.2" fill="#9b9f9d" xml:space="preserve" >capture.</text><rect x="330" y="296" width="250" height="126" rx="2" fill="#101316" stroke="#a8c8bb" stroke-width="1" stroke-opacity="0.28" /><circle cx="354" cy="322" r="11" fill="none" stroke="#a8c8bb" stroke-width="1.1" stroke-opacity="0.6" /><text x="354" y="326" class="m" font-size="10.5" fill="#a8c8bb" text-anchor="middle" xml:space="preserve" >6</text><text x="376" y="326" class="m" font-size="12.5" fill="#d3ded4" xml:space="preserve" >Compare</text><text x="346" y="354" class="b" font-size="11.2" fill="#9b9f9d" xml:space="preserve" >Both outputs are trimmed at the end.</text><text x="346" y="370" class="b" font-size="11.2" fill="#9b9f9d" xml:space="preserve" >solved is actual === expected.</text><rect x="620" y="296" width="250" height="126" rx="2" fill="#101316" stroke="#dbe1e1" stroke-width="1" stroke-opacity="0.1" /><circle cx="644" cy="322" r="11" fill="none" stroke="#a8c8bb" stroke-width="1.1" stroke-opacity="0.6" /><text x="644" y="326" class="m" font-size="10.5" fill="#a8c8bb" text-anchor="middle" xml:space="preserve" >7</text><text x="666" y="326" class="m" font-size="12.5" fill="#d3ded4" xml:space="preserve" >Reply</text><text x="636" y="354" class="b" font-size="11.2" fill="#9b9f9d" xml:space="preserve" >The worker sends output and solved.</text><text x="636" y="370" class="b" font-size="11.2" fill="#9b9f9d" xml:space="preserve" >The output card shows READY.</text><rect x="910" y="296" width="250" height="126" rx="2" fill="#101316" stroke="#a8c8bb" stroke-width="1" stroke-opacity="0.28" /><circle cx="934" cy="322" r="11" fill="none" stroke="#a8c8bb" stroke-width="1.1" stroke-opacity="0.6" /><text x="934" y="326" class="m" font-size="10.5" fill="#a8c8bb" text-anchor="middle" xml:space="preserve" >8</text><text x="956" y="326" class="m" font-size="12.5" fill="#d3ded4" xml:space="preserve" >Record progress</text><text x="926" y="354" class="b" font-size="11.2" fill="#9b9f9d" xml:space="preserve" >A first solve adds essence and</text><text x="926" y="370" class="b" font-size="11.2" fill="#9b9f9d" xml:space="preserve" >updates the day streak. Saved to</text><text x="926" y="386" class="b" font-size="11.2" fill="#9b9f9d" xml:space="preserve" >localStorage.</text><path d="M290 191 L330 191" fill="none" stroke="#a8c8bb" stroke-opacity="1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar)"/><path d="M580 191 L620 191" fill="none" stroke="#a8c8bb" stroke-opacity="1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar)"/><path d="M870 191 L910 191" fill="none" stroke="#a8c8bb" stroke-opacity="1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar)"/><path d="M290 359 L330 359" fill="none" stroke="#a8c8bb" stroke-opacity="1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar)"/><path d="M580 359 L620 359" fill="none" stroke="#a8c8bb" stroke-opacity="1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar)"/><path d="M870 359 L910 359" fill="none" stroke="#a8c8bb" stroke-opacity="1" stroke-width="1.2" stroke-linecap="round" marker-end="url(#ar)"/><path d="M1035 254 L1035 272 L165 272 L165 292" fill="none" stroke="#a8c8bb" stroke-width="1.2" stroke-opacity="1" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)" /><text x="40" y="462" class="m" font-size="9.5" fill="#92ab9f" letter-spacing="1.6150000000000002" xml:space="preserve" >WHEN IT DOES NOT GO TO PLAN</text><rect x="40" y="478" width="360" height="128" rx="2" fill="#101316" stroke="#dc8e87" stroke-width="1" stroke-opacity="0.28" /><text x="56" y="502" class="m" font-size="9" fill="#dc8e87" letter-spacing="1.53" xml:space="preserve" >PYTHON ERROR</text><g transform="translate(366 490) scale(0.7500)" fill="none" stroke="#dc8e87" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.6a2.6 2.6 0 1 1 3.6 2.4c-.7.4-1.1.9-1.1 1.8M12 16.6h.01"/></g><text x="56" y="526" class="m" font-size="12.5" fill="#d3ded4" xml:space="preserve" >Traceback, last three lines</text><text x="56" y="546" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >The error is shown in red in the output card.</text><text x="56" y="561" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >Nothing is saved and you can run again.</text><rect x="420" y="478" width="360" height="128" rx="2" fill="#101316" stroke="#c7b68e" stroke-width="1" stroke-opacity="0.28" /><text x="436" y="502" class="m" font-size="9" fill="#c7b68e" letter-spacing="1.53" xml:space="preserve" >TIMEOUT OR WORKER FAILURE</text><g transform="translate(746 490) scale(0.7500)" fill="none" stroke="#c7b68e" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5a4.5 4.5 0 0 1-.5-8.97 6 6 0 0 1 11.3 1.47A4 4 0 0 1 17.5 18.5z"/></g><text x="436" y="526" class="m" font-size="12.5" fill="#d3ded4" xml:space="preserve" >After 120 s, or on a worker error</text><text x="436" y="546" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >The worker is terminated and recreated on the next</text><text x="436" y="561" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >tap, with a message asking you to check your</text><text x="436" y="576" class="b" font-size="11" fill="#9b9f9d" xml:space="preserve" >connection.</text><rect x="800" y="478" width="360" height="128" rx="2" fill="#101316" stroke="#a8c8bb" stroke-width="1" stroke-opacity="0.28" /><text x="816" y="502" class="m" font-size="9" fill="#a8c8bb" letter-spacing="1.53" xml:space="preserve" >EXAMPLE · LEVEL 7</text><text x="816" y="534" class="m" font-size="11" fill="#75847b" xml:space="preserve" >actual</text><text x="896" y="534" class="m" font-size="11" fill="#d3ded4" xml:space="preserve" >"1\n2\n3\n4\n5"</text><text x="816" y="558" class="m" font-size="11" fill="#75847b" xml:space="preserve" >expected</text><text x="896" y="558" class="m" font-size="11" fill="#d3ded4" xml:space="preserve" >"1\n2\n3\n4\n5"</text><text x="816" y="582" class="m" font-size="11" fill="#75847b" xml:space="preserve" >solved</text><text x="896" y="582" class="m" font-size="11" fill="#a8c8bb" xml:space="preserve" >true</text></svg>
